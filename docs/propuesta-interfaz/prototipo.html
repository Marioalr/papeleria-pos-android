}
/* Lo contado: «Lo mío», «Falta» y «Fuera de lugar», con las pestañas abajo, junto al pulgar */
function hojaContado() {
  const c = S.conteo, t = conteoActivo();
  if (!t) return '';
  const dia = t.tipo === 'dia', tienda = S.celular === 'tienda';
  const fuera = dia ? [] : c.fuera;
  let tab = S.tabContado || 'mio';
  if (tab === 'fuera' && !fuera.length) tab = 'mio';
  const nombreEstado = { contando: 'contando, sin guardar', 'sin-aplicar': 'sin aplicar', 'por-subir': 'por subir', subida: 'subida', 'por-aplicar': 'por aplicar', aplicada: 'aplicada', 'no-entro': 'no entró' };
  const icEstado = { subida: 'check', aplicada: 'check', 'por-subir': 'subir', 'por-aplicar': 'subir' };
  const estadoTxt = (e, desde) => `${icEstado[e] ? ic(icEstado[e], 'i ch') : ''}${nombreEstado[e] || e}${e === 'sin-aplicar' && desde ? ` · hace ${minutosDesde(desde)} min` : ''}`;
  const cant = n => n === 0 ? '<span class="cant num no-hay">no hay</span>' : `<span class="cant num">${n}</span>`;
  // «Lo mío»
  const mio = [];
  if (dia) {
    if (c.actual) mio.push({ codigo: c.actual.codigo, total: totalDia(c.actual.codigo), det: [[c.actual.lugar, piezasDe(c.actual)], ...otrosLugaresDia(c.actual.codigo)], estado: 'contando' });
    for (const [k, d] of Object.entries(c.dia)) if (!(c.actual && c.actual.codigo === k)) mio.push({ codigo: k, total: d.estado === 'sin-aplicar' ? totalDia(k) : d.total, det: Object.entries(d.lugares), estado: d.estado, desde: d.desde, hora: d.hora });
  } else {
    if (c.actual && nuevasDe(c.actual) > 0) mio.push({ codigo: c.actual.codigo, total: nuevasDe(c.actual), lugar: c.actual.lugar, hora: 'ahora', estado: 'contando' });
    for (const k of c.capturas) mio.push({ ...k, total: k.cant });
  }
  // «Falta»: lo que nadie ha contado, por nombre, con su departamento
  const falta = dia
    ? DEL_DIA.filter(k => !DIA_DE_OTROS[k] && !(c.dia[k] && c.dia[k].estado !== 'sin-aplicar') && !(c.actual && c.actual.codigo === k)).map(k => POR_CODIGO.get(k))
    : CATALOGO.filter(p => p.depto === t.depto && !p.base && !DE_OTROS[p.codigo] && !c.capturas.some(k => k.codigo === p.codigo) && !(c.actual && c.actual.codigo === p.codigo));
  falta.sort((x, y) => x.nombre.localeCompare(y.nombre, 'es'));
  let filas = '';
  if (tab === 'mio') {
    filas = mio.length ? mio.map(k => {
      const p = POR_CODIGO.get(k.codigo);
      const para = !dia && k.conteo && k.conteo !== t.id ? ` · para ${esc(CONTEOS.find(x => x.id === k.conteo).titulo)}` : '';
      const det = dia ? `${k.det.length ? textoLugares(k.det) + ' · ' : ''}${estadoTxt(k.estado, k.desde)}` : `${esc(k.lugar || '')} · ${k.hora} · ${estadoTxt(k.estado)}${para}`;
      const accion = !dia && k.id && k.estado !== 'no-entro' ? `<button class="btn-ic" data-a="quitarCaptura" data-id="${k.id}" aria-label="Quitar esta captura">${ic('bote')}</button>`
        : dia && k.estado === 'sin-aplicar' ? `<button class="btn tonal" style="min-height:48px;padding:0 12px;font-size:14px" data-a="esTodoDe" data-c="${k.codigo}">¿Es todo?</button>` : '<span></span>';
      return `<div class="captura${k.estado === 'no-entro' ? ' no-entro' : ''}"><div><div class="nom">${esc(p.nombre)}</div><div class="det">${det}</div></div>${cant(k.total)}${accion}</div>`;
    }).join('') : `<div class="vacio"><strong>Todavía no cuentas nada</strong>Regresa al escáner y escanea el primer producto.</div>`;
  } else if (tab === 'falta') {
    filas = falta.length ? falta.map(p => {
      const ab = dia && abiertoDe(p.depto);
      if (ab) return `<div class="captura falta gris"><div><div class="nom">${esc(p.nombre)}</div><div class="det">en ${esc(ab.titulo)}: se cuenta ahí</div></div><span></span><span></span></div>`;
      return `<button class="captura falta" data-a="faltaContar" data-c="${p.codigo}"><div><div class="nom">${esc(p.nombre)}</div><div class="det">${DEPTOS[p.depto]} · tocar para contarlo o decir «no hay»</div></div><span></span>${ic('adelante', 'i ch')}</button>`;
    }).join('') : `<div class="vacio"><strong>No falta nada</strong>Díselo al encargado: revisa y cierra en la caja.</div>`;
    if (!dia && falta.length) filas += `<p class="nota" style="margin-top:8px">En el prototipo, ${falta.length} de muestra; en la tienda son todos los del departamento que nadie ha contado.</p>`;
  } else {
    filas = fuera.map(f => {
      const p = POR_CODIGO.get(f.codigo), ab = abiertoDe(f.depto);
      const accion = ab ? `<button class="btn tonal" style="min-height:48px;padding:0 12px;font-size:14px" data-a="contarFuera" data-c="${f.codigo}">Contarlo para ${DEPTOS[f.depto]}</button>` : `<button class="btn borde" style="min-height:48px;padding:0 12px;font-size:14px" data-a="yaLoLleve" data-c="${f.codigo}">Ya lo llevé</button>`;
      return `<div class="captura"><div><div class="nom">${esc(p.nombre)}</div><div class="det">Es de ${DEPTOS[f.depto]} · ${f.hora}</div></div><span></span>${accion}</div>`;
    }).join('');
  }
  const sub = dia ? `${DEL_DIA.length} productos · ${sinAplicar().length} sin aplicar` : `${c.capturas.length} ${c.capturas.length === 1 ? 'captura' : 'capturas'}${c.porSubir ? ` · ${c.porSubir} por subir` : ''}`;
  const pestana = (v, txt) => `<button class="${tab === v ? 'on' : ''}" role="tab" aria-selected="${tab === v}" data-a="tabContado" data-v="${v}">${txt}</button>`;
  return `<div class="hoja completa modo-conteo"><div class="contenido">${barraHoja(`${esc(dia ? 'Del día' : t.titulo)} · lo que contaste`, sub, 'cerrarHoja', 'atras')}
    <div class="desliza" style="display:flex;flex-direction:column"><div class="capturas" style="margin-top:auto">${filas}</div></div>
    <div class="pie">
      <div class="pestanas" role="tablist">${pestana('mio', `Lo mío (${mio.length})`)}${pestana('falta', `Falta (${falta.length})`)}${fuera.length ? pestana('fuera', `Fuera (${fuera.length})`) : ''}</div>
      <div class="fila-botones"><button class="btn borde crece" data-a="contarOtraCosa">Contar otra cosa</button><button class="btn lleno crece" data-a="salirConteo">${tienda ? 'Terminé mi parte y salir' : 'Terminé mi parte'}</button></div>
      <p class="nota centro" style="margin:0">Revisar y cerrar: en la caja (F4).</p>
    </div></div></div>`;
}
/* «Es todo»: el total del día pide confirmar, porque se aplica ya y no se corrige */
function hojaAplicarDia() {
  const codigo = S.hojaDatos.codigo, p = POR_CODIGO.get(codigo), c = S.conteo;
  const total = totalDia(codigo), a = c.actual && c.actual.codigo === codigo ? c.actual : null, otros = otrosLugaresDia(codigo);

}
/* Las capturas de un producto: quién, dónde, cuánto y a qué hora. Las de otros las quita quien tiene «Conteo completo» */
function hojaCapturasProducto() {
  const codigo = S.hojaDatos && S.hojaDatos.codigo, p = POR_CODIGO.get(codigo), per = PERSONAS[S.persona], c = S.conteo, t = conteoActivo();
  if (t && t.tipo === 'dia') {
    const a = c.actual && c.actual.codigo === codigo ? c.actual : null;
    const filas = (a ? [[a.lugar, piezasDe(a), 'contando']] : []).concat(otrosLugaresDia(codigo).map(([l, v]) => [l, v, 'sin aplicar']));
    return `<div class="hoja modo-conteo"><div class="contenido">${barraHoja(esc(p.nombre), `Del día: ${totalDia(codigo)} en total`)}<div class="desliza"><div class="capturas">
      ${filas.map(([l, v, e]) => `<div class="captura"><div><div class="nom">Tú · ${esc(l)}</div><div class="det">${e}</div></div><span class="cant num">${v}</span><span></span></div>`).join('')}
      </div><p class="nota" style="margin-top:10px">El del día es el total de la tienda: lo de cada lugar se suma y se aplica una vez, con «Es todo».</p></div></div></div>`;
  }
  const otras = (DE_OTROS[codigo] || []).map((o, i) => ({ quien: quienDice(o.quien), cant: o.cant, hora: o.hora, lugar: o.lugar, i, enConteo: o.enConteo }));
  const mias = c.capturas.filter(k => k.codigo === codigo).map(k => ({ quien: 'tú', cant: k.cant, hora: k.hora, lugar: k.lugar, id: k.id }));
  const contando = c.actual && c.actual.codigo === codigo && nuevasDe(c.actual) > 0 ? [{ quien: 'tú', cant: nuevasDe(c.actual), hora: 'contando', lugar: c.actual.lugar }] : [];
  const todas = contando.concat(mias, otras);
  const suma = redondo(todas.reduce((s, k) => s + k.cant, 0));
  return `<div class="hoja modo-conteo"><div class="contenido">${barraHoja(esc(p.nombre), `Ya van ${suma} en ${todas.length} ${todas.length === 1 ? 'captura' : 'capturas'}`)}<div class="desliza"><div class="capturas">
    ${todas.map(k => `<div class="captura"><div><div class="nom">${k.quien[0].toUpperCase() + k.quien.slice(1)} · ${esc(k.lugar || '')}${k.enConteo ? ' <small class="nota">(en /conteo)</small>' : ''}</div><div class="det">${k.hora}</div></div><span class="cant num">${k.cant}</span>${k.id ? `<button class="btn-ic" data-a="quitarCaptura" data-id="${k.id}" aria-label="Quitar">${ic('bote')}</button>` : k.i != null && per.completo ? `<button class="btn-ic" data-a="quitarDeOtro" data-c="${codigo}" data-i="${k.i}" aria-label="Quitar la captura de ${esc(k.quien)}">${ic('bote')}</button>` : '<span></span>'}</div>`).join('')}
    </div><p class="nota" style="margin-top:10px">Cuenta lo de aquí aunque ya vaya algo. ${per.completo ? 'Con «Conteo completo» se quitan también las de otros (la captura equivocada se quita y se cuenta otra vez).' : 'Cada quien quita las suyas; las de otros, el encargado.'} Nunca sale lo que dice el sistema.</p></div></div></div>`;
}

/* ——— La sesión ———

function pintarGuia(dest) {
  const g = GUIA.find(x => x.id === S.guia);
  let h = `<h2>Qué probar</h2><p>Todo es ficticio. En la PC, Espacio o la franja leen el siguiente código de la tarea; arriba, «Leer» lee el que elijas. Arriba también se elige la red, de quién es el celular y el tamaño de la pantalla.</p><h3>Tareas</h3><ol>`;
  const item = t => `<li><button data-g="${t.id}" class="${S.guia === t.id ? 'on' : ''}"><strong>${t.titulo}</strong><small>${t.texto}</small></button>${S.guia === t.id && g ? `<div class="pasos"><ol>${g.pasos.map(p => `<li>${p}</li>`).join('')}</ol></div>` : ''}</li>`;
  h += GUIA.filter(t => t.grupo !== 'contar').map(item).join('');
  h += `</ol><h3 class="grupo-contar">Contar · la propuesta, todavía sin implementar</h3><ol>`;
  h += GUIA.filter(t => t.grupo === 'contar').map(item).join('');
  h += `</ol><p class="pie">La cámara, la franja, la guía y la confirmación verde son las de hoy: el núcleo de reconocimiento no cambia. Propuesta: docs/propuesta-interfaz.md.</p>`;
  dest.innerHTML = h;
}
function elegirGuia(id) {
  const t = GUIA.find(x => x.id === id);
  temporizadores.forEach(clearTimeout); temporizadores = [];
  const keep = { tam: S.tam, tema: S.tema, letraGrande: S.letraGrande, verGesto: S.verGesto };   // lo de «Ver» se queda
  S = { ...INICIO(), ...keep, guia: id };
  CAJAS[0].esperan = 1; CAJAS[1].esperan = 0; CONTEOS = ESCENARIOS_CONTEO.normal(); DE_OTROS = DE_OTROS_INICIO(); DIA_DE_OTROS = DIA_DE_OTROS_INICIO();
  t.prep(); cargarPistas();
  pintar(); pintarGuia($('#guia')); const c = $('#cortina'); if (!c.hidden) pintarCortina();
}
document.addEventListener('click', e => {
  const b = e.target.closest('[data-g]'); if (!b) return;
  elegirGuia(b.dataset.g);
  if (esCelular()) { $('#cortina').hidden = true; }
});

/* En el celular: el botón de arriba abre la barra y la guía */
const cortina = $('#cortina');
function pintarCortina() {
  cortina.innerHTML = `<div style="display:flex;justify-content:flex-end;margin-bottom:8px"><button class="btn tonal" id="cerrar-cortina" type="button">${ic('cerrar')}Regresar a la app</button></div>`;
  const barra = $('#proto').cloneNode(true); barra.removeAttribute('id');
  const s2 = barra.querySelector('select'); if (s2) { s2.id = 'leer-codigo-2'; s2.value = sel.value; s2.addEventListener('change', () => { sel.value = s2.value; }); }
  cortina.appendChild(barra);
  const g = document.createElement('div'); g.className = 'guia'; pintarGuia(g); cortina.appendChild(g);
}
$('#asa').addEventListener('click', () => { pintarCortina(); cortina.hidden = false; });
cortina.addEventListener('click', e => { if (e.target.closest('#cerrar-cortina') || e.target.closest('[data-p="leer"]')) cortina.hidden = true; });

/* La escala del celular en la PC: que quepa a lo alto */
function ajustarEscala() {
  const marco = $('#marco'), soporte = $('#soporte');
  if (esCelular()) { marco.style.transform = ''; soporte.style.width = soporte.style.height = ''; return; }
  const w = tel.offsetWidth + 20, h = tel.offsetHeight + 20;
  const libre = window.innerHeight - $('#proto').offsetHeight - 44;
  const k = Math.min(1, Math.max(.45, libre / h));
  marco.style.transform = `scale(${k})`;
  soporte.style.width = `${w * k}px`; soporte.style.height = `${h * k}px`;
}
window.addEventListener('resize', () => { ajustarEscala(); pintar(); });

pintar(); pintarGuia($('#guia')); ajustarEscala();
