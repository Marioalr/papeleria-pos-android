<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>App Android de Papelería POS</title>
<meta name="claude:viewport-fit-sides" content="cover">
<style>
/* El prototipo de la app Android conectada al POS (docs/propuesta-interfaz.md). En la PC: la barra del prototipo arriba,
   el celular a escala en su marco y «Qué probar» a un lado. En el celular: la app a pantalla completa y el prototipo en
   un botón. Dentro de la app: la cámara de fondo, la franja intocable en medio (del 32 al 68 % del visor, como hoy) y
   todo lo que se toca abajo, al alcance del pulgar. Letras del sistema (en Android, Roboto), sin nada de internet. */
:root {
  /* Fuera de la app */
  --mesa: #dfe4ea;
  --noche: #15202a;
  --noche-2: #22313f;
  --noche-borde: #34495c;
  --noche-texto: #e7edf3;
  --noche-suave: #9db0c2;
  /* El tema de la app (app/tema/Tema.kt): azul petróleo y grises, sin los colores dinámicos del sistema */
  --sup: #f7f9fb;
  --sup-1: #eef2f5;
  --sup-2: #e4e9ee;
  --linea: #d3dbe2;
  --borde: #a9b5bf;
  --texto: #181c1f;
  --suave: #40484d;
  --tenue: #687279;
  --pri: #1d5c7a;
  --en-pri: #ffffff;
  --pri-c: #c8e6f7;
  --en-pri-c: #001e2c;
  /* Un color por modo: el precio en ámbar, como el verificador (F9) de la caja; el conteo en violeta (el terciario) */
  --precio: #8a5300;
  --en-precio: #ffffff;
  --precio-c: #ffe2b0;
  --en-precio-c: #2b1700;
  --conteo: #5f5a7d;
  --en-conteo: #ffffff;
  --conteo-c: #e5defb;
  --en-conteo-c: #1b1736;
  /* Estados */
  --exito: #2e7d32;
  --exito-c: #d6efd7;
  --en-exito-c: #0b2e0d;
  --error: #b3261e;
  --error-c: #f9dedc;
  --en-error-c: #410e0b;
  --aviso: #7a4a00;
  --aviso-c: #fff0d0;
  --velo: rgba(12, 20, 28, .42);
  --sombra: rgba(14, 26, 36, .22);
  /* El escáner (escaner/ui/Tonos.kt): igual en los dos temas, como en la app */
  --capa: rgba(0, 0, 0, .6);
  --ambar: #ffc107;
  --verde: #2e7d32;
  --laser: #ff1744;
  --chip: #1e1e1e;
  --f-texto: Roboto, "Segoe UI", system-ui, -apple-system, "Helvetica Neue", Arial, sans-serif;
  --f-codigo: "Roboto Mono", "Cascadia Mono", Consolas, "SF Mono", Menlo, monospace;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --mesa: #0c1115; --sup: #101417; --sup-1: #1b2024; --sup-2: #262c30; --linea: #343c42; --borde: #59646c;
    --texto: #dfe3e7; --suave: #bfc8ce; --tenue: #8e979d;
    --pri: #8ecff0; --en-pri: #003549; --pri-c: #004c68; --en-pri-c: #c8e6f7;
    --precio: #ffb951; --en-precio: #2b1700; --precio-c: #4d3200; --en-precio-c: #ffdfb0;
    --conteo: #c9c1ea; --en-conteo: #312c4c; --conteo-c: #47426a; --en-conteo-c: #e5defb;
    --exito: #81c784; --exito-c: #1d3d1f; --en-exito-c: #c8ecc9;
    --error: #f2b8b5; --error-c: #8c1d18; --en-error-c: #f9dedc;
    --aviso: #ffc95c; --aviso-c: #3a2a00; --velo: rgba(0, 0, 0, .55); --sombra: rgba(0, 0, 0, .5);
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --mesa: #0c1115; --sup: #101417; --sup-1: #1b2024; --sup-2: #262c30; --linea: #343c42; --borde: #59646c;
  --texto: #dfe3e7; --suave: #bfc8ce; --tenue: #8e979d;
  --pri: #8ecff0; --en-pri: #003549; --pri-c: #004c68; --en-pri-c: #c8e6f7;
  --precio: #ffb951; --en-precio: #2b1700; --precio-c: #4d3200; --en-precio-c: #ffdfb0;
  --conteo: #c9c1ea; --en-conteo: #312c4c; --conteo-c: #47426a; --en-conteo-c: #e5defb;
  --exito: #81c784; --exito-c: #1d3d1f; --en-exito-c: #c8ecc9;
  --error: #f2b8b5; --error-c: #8c1d18; --en-error-c: #f9dedc;
  --aviso: #ffc95c; --aviso-c: #3a2a00; --velo: rgba(0, 0, 0, .55); --sombra: rgba(0, 0, 0, .5);
  color-scheme: dark;
}

* { box-sizing: border-box; }
html, body { height: 100%; }
body { margin: 0; background: var(--mesa); color: var(--texto); font: 14px/1.4 var(--f-texto); -webkit-tap-highlight-color: transparent; }
button, input, select { font: inherit; color: inherit; }
button { background: none; border: 0; padding: 0; cursor: pointer; }
button:disabled { cursor: default; }
:focus-visible { outline: 3px solid var(--pri); outline-offset: 2px; }
svg.i { width: 24px; height: 24px; fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; flex: none; }
svg.i.ch { width: 20px; height: 20px; }
.num { font-variant-numeric: tabular-nums; }
.codigo { font-family: var(--f-codigo); letter-spacing: .02em; }
@media (prefers-reduced-motion: reduce) { *, *::before, *::after { animation-duration: 1ms !important; animation-iteration-count: 1 !important; transition-duration: 1ms !important; } }

/* ——— La barra del prototipo (fuera de la app) ——— */
.proto { display: flex; flex-wrap: wrap; align-items: center; gap: 8px 16px; padding-block: 8px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); background: var(--noche); color: var(--noche-texto); font-size: 12.5px; }
.proto strong { font-size: 13px; letter-spacing: .01em; }
.proto .grupo { display: flex; align-items: center; gap: 4px; flex-wrap: wrap; }
.proto .grupo > span { font-size: 10.5px; letter-spacing: .08em; text-transform: uppercase; color: var(--noche-suave); margin-right: 2px; }
.proto button, .proto select { border: 1px solid var(--noche-borde); background: var(--noche-2); color: var(--noche-texto); padding: 4px 10px; border-radius: 999px; font-size: 12.5px; }
.proto button:hover { border-color: var(--noche-suave); }
.proto button.on { background: var(--noche-texto); color: var(--noche); border-color: var(--noche-texto); font-weight: 600; }
.proto select { max-width: 230px; }
.proto .espacio { flex: 1; }
.proto :focus-visible { outline-color: var(--noche-texto); }

.escenario { display: flex; gap: 20px; align-items: flex-start; justify-content: center; padding-block: 16px 28px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
.soporte { flex: none; position: relative; }
.marco { position: absolute; top: 0; left: 0; transform-origin: 0 0; padding: 10px; border-radius: 46px; background: #0a0d10; box-shadow: 0 18px 44px rgba(8, 16, 24, .3), inset 0 0 0 1px rgba(255, 255, 255, .07); }
.telefono { --sb: 32px; --gb: 20px; position: relative; width: 448px; height: 997px; border-radius: 36px; overflow: hidden; background: #000; color: var(--texto); isolation: isolate; font-size: 16px; line-height: 1.35; }
.telefono[data-tam="mediano"] { width: 412px; height: 915px; --sb: 28px; }
.telefono[data-tam="chico"] { width: 360px; height: 740px; --sb: 24px; }

.guia { flex: none; width: 340px; max-height: calc(100vh - 110px); overflow: auto; background: var(--sup); border: 1px solid var(--linea); border-radius: 12px; padding: 14px 14px 12px; color: var(--texto); }
.guia h2 { margin: 0 0 4px; font-size: 16px; text-wrap: balance; }
.guia > p { margin: 0 0 10px; color: var(--suave); font-size: 13px; }
.guia h3 { margin: 14px 0 6px; font-size: 11px; letter-spacing: .08em; text-transform: uppercase; color: var(--tenue); }
.guia ol { margin: 0; padding: 0; list-style: none; display: flex; flex-direction: column; gap: 6px; }
.guia li > button { width: 100%; text-align: left; border: 1px solid var(--linea); background: var(--sup-1); border-radius: 8px; padding: 8px 10px; display: flex; flex-direction: column; gap: 2px; }
.guia li > button:hover { border-color: var(--pri); }
.guia li > button.on { border-color: var(--pri); background: var(--pri-c); color: var(--en-pri-c); }
.guia li strong { font-size: 13.5px; }
.guia li small { color: var(--suave); font-size: 12.5px; line-height: 1.4; }
.guia li > button.on small { color: inherit; }
.guia .pasos { margin: 8px 0 0; padding: 10px 12px; border-radius: 8px; background: var(--sup-1); font-size: 13px; color: var(--suave); }
.guia .pasos ol { list-style: decimal; padding-left: 18px; gap: 4px; }
.guia .pie { margin-top: 12px; font-size: 12px; color: var(--tenue); }
.guia kbd { font: 600 11px var(--f-codigo); padding: 1px 5px; border: 1px solid var(--borde); border-bottom-width: 2px; border-radius: 4px; }

/* En el celular: la app a pantalla completa; el prototipo, en el botón de arriba */
.asa { display: none; }
@media (max-width: 759px) {
  body { background: #000; overflow: hidden; }
  .proto, .escenario > .guia { display: none; }
  .escenario { display: block; height: 100%; padding: 0; }
  .soporte { width: 100% !important; height: 100% !important; }
  .marco { position: static; transform: none !important; width: 100%; height: 100%; padding: 0; border-radius: 0; box-shadow: none; }
  .telefono, .telefono[data-tam] { width: 100%; height: 100%; border-radius: 0; --sb: 0px; --gb: 0px; }
  .barra-estado, .barra-gestos { display: none !important; }
  .asa { display: flex; position: fixed; z-index: 60; top: calc(env(safe-area-inset-top, 0px) + 96px); right: env(safe-area-inset-right, 0px); left: auto; transform: none; border-radius: 999px 0 0 999px !important; align-items: center; gap: 6px; padding: 5px 12px; border-radius: 999px; background: rgba(21, 32, 42, .86); color: #e7edf3; font-size: 12px; border: 1px solid rgba(255, 255, 255, .18); }
  .cortina { position: fixed; inset: 0; z-index: 70; overflow: auto; background: var(--sup); padding-block: calc(env(safe-area-inset-top, 0px) + 12px) 24px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
  .cortina .proto { display: flex; border-radius: 12px; margin-bottom: 12px; }
  .cortina .guia { width: auto; max-height: none; }
}
.cortina[hidden] { display: none; }

/* ——— Barras del sistema (solo en el marco) ——— */
.barra-estado { position: absolute; z-index: 40; top: 0; left: 0; right: 0; height: var(--sb); display: flex; align-items: center; justify-content: space-between; padding: 0 22px; font-size: 13px; font-weight: 500; color: #fff; background: #000; pointer-events: none; }
.barra-estado.clara { background: var(--sup); color: var(--texto); }
.barra-estado .ics { display: flex; gap: 6px; align-items: center; }
.barra-estado svg { width: 16px; height: 16px; fill: currentColor; }
.barra-gestos { position: absolute; z-index: 45; left: 0; right: 0; bottom: 0; height: var(--gb); display: grid; place-items: center; pointer-events: none; }
.barra-gestos::after { content: ""; width: 108px; height: 4px; border-radius: 2px; background: var(--texto); opacity: .55; }
.barra-gestos.sobre-negro::after { background: #fff; }

/* ——— El visor y el escáner (sin cambios: lo de escaner/ui) ——— */
.app { position: absolute; inset: 0; }
.visor { position: absolute; left: 0; right: 0; top: var(--sb); height: calc(100% - var(--sb) - var(--gb) - 80px); overflow: hidden; background: #0c0e10; }
.imagen { position: absolute; inset: -24px; background:
  radial-gradient(60% 30% at 25% 18%, rgba(255, 230, 190, .22), transparent 70%),
  linear-gradient(180deg, #2b2f33 0 9%, #4a3d2c 9% 11%, #20262b 11% 30%, #4a3d2c 30% 32%, #1e2428 32% 54%, #4a3d2c 54% 56%, #23292d 56% 78%, #4a3d2c 78% 80%, #1b2023 80%);
  filter: blur(2.5px) saturate(.9); }
.imagen i { position: absolute; border-radius: 3px; opacity: .78; }
.franja { position: absolute; z-index: 2; left: 4%; right: 4%; top: 32%; height: 36%; border-radius: 12px; box-shadow: 0 0 0 200vmax var(--capa); }
.franja .esq { position: absolute; width: 28px; height: 28px; border: 4px solid #fff; animation: pulso 2.5s ease-in-out infinite; }
.franja .e1 { top: 0; left: 0; border-right: 0; border-bottom: 0; border-top-left-radius: 12px; }
.franja .e2 { top: 0; right: 0; border-left: 0; border-bottom: 0; border-top-right-radius: 12px; }
.franja .e3 { bottom: 0; left: 0; border-right: 0; border-top: 0; border-bottom-left-radius: 12px; }
.franja .e4 { bottom: 0; right: 0; border-left: 0; border-top: 0; border-bottom-right-radius: 12px; }
@keyframes pulso { 50% { opacity: .55; } }
.franja .laser { position: absolute; left: 7%; right: 7%; top: 50%; height: 2px; margin-top: -1px; background: var(--laser); box-shadow: 0 0 10px 2px rgba(255, 23, 68, .55); }
.franja.leido { box-shadow: 0 0 0 200vmax var(--capa), inset 0 0 0 4px var(--verde), 0 0 0 4px var(--verde); }
.franja.leido .esq, .franja.leido .laser, .franja.viendo .laser { display: none; }
.franja .tocar { position: absolute; inset: 0; border-radius: 12px; }
.franja .pista { position: absolute; left: 50%; bottom: 10px; transform: translateX(-50%); white-space: nowrap; font-size: 12px; color: rgba(255, 255, 255, .8); background: rgba(0, 0, 0, .45); padding: 3px 10px; border-radius: 999px; pointer-events: none; }
.etiqueta-vista { position: absolute; left: 50%; top: 50%; width: 62%; max-width: 230px; transform: translate(-50%, -50%) rotate(-4deg); background: #f4f2ec; border-radius: 6px; padding: 8px 10px 4px; box-shadow: 0 6px 14px rgba(0, 0, 0, .4); pointer-events: none; }
.etiqueta-vista svg { display: block; width: 100%; height: auto; }
.etiqueta-vista.qr { width: 34%; padding: 8px; }
.ambar { position: absolute; inset: -10px; pointer-events: none; }
.ambar b { position: absolute; width: 20px; height: 20px; border: 3px solid var(--ambar); }
.ambar b:nth-child(1) { top: 0; left: 0; border-right: 0; border-bottom: 0; }
.ambar b:nth-child(2) { top: 0; right: 0; border-left: 0; border-bottom: 0; }
.ambar b:nth-child(3) { bottom: 0; left: 0; border-right: 0; border-top: 0; }
.ambar b:nth-child(4) { bottom: 0; right: 0; border-left: 0; border-top: 0; }
.leido-centro { position: absolute; z-index: 3; left: 50%; top: 50%; transform: translate(-50%, -50%); display: flex; align-items: center; gap: 10px; max-width: 92%; padding: 10px 16px; border-radius: 20px; background: var(--verde); color: #fff; font: 600 21px/1.2 var(--f-codigo); white-space: nowrap; animation: entra .15s ease-out; pointer-events: none; }
.leido-centro svg { width: 30px; height: 30px; stroke-width: 2.6; }
@keyframes entra { from { transform: translate(-50%, -50%) scale(.85); opacity: .4; } }
.destello { position: absolute; inset: 0; z-index: 1; background: rgba(46, 125, 50, .22); animation: destello .45s ease-out forwards; pointer-events: none; }
@keyframes destello { to { opacity: 0; } }
.indicacion { position: absolute; z-index: 3; left: 50%; bottom: calc(68% + 16px); transform: translateX(-50%); display: flex; align-items: center; gap: 10px; max-width: calc(100% - 32px); padding: 10px 16px; border-radius: 24px; background: var(--chip); color: #fff; font-size: 19px; font-weight: 500; white-space: nowrap; pointer-events: none; }
.indicacion svg { width: 26px; height: 26px; }
.indicacion.accion svg { color: var(--ambar); }
.linterna { position: absolute; z-index: 4; top: 12px; right: max(16px, env(safe-area-inset-right, 0px)); width: 56px; height: 56px; border-radius: 50%; display: grid; place-items: center; background: var(--chip); color: #fff; }
.linterna.on { background: #fff; color: #111; }
.pausa { position: absolute; z-index: 5; inset: 0; background: rgba(0, 0, 0, .55); display: grid; place-items: center; color: #fff; text-align: center; }
.pausa div { background: var(--chip); border-radius: 24px; padding: 20px 24px; }
.pausa strong { display: block; font-size: 20px; }

/* Arriba a la izquierda: quién y cómo está la red (solo si algo falla) */
.quien { position: absolute; z-index: 4; top: 12px; left: max(16px, env(safe-area-inset-left, 0px)); display: flex; align-items: center; gap: 8px; max-width: calc(100% - 100px); }
.ficha-yo { width: 48px; height: 48px; border-radius: 50%; display: grid; place-items: center; background: var(--chip); color: #fff; font-size: 19px; font-weight: 700; border: 2px solid rgba(255, 255, 255, .85); }
.estado-red { display: inline-flex; align-items: center; gap: 6px; height: 36px; padding: 0 12px; border-radius: 18px; background: var(--chip); color: #fff; font-size: 14px; font-weight: 500; white-space: nowrap; }
.estado-red i { width: 10px; height: 10px; border-radius: 50%; background: var(--ambar); }
.estado-red.caida i { background: #ff5252; }
.estado-red.subir i { background: #8ecff0; }
.quien { flex-wrap: wrap; row-gap: 6px; }
.ficha-yo.tienda svg.i { width: 24px; height: 24px; }
.pie-alta { position: sticky; bottom: calc(-1 * (var(--gb) + 14px)); margin: auto 0 calc(-1 * (var(--gb) + 14px)); padding: 16px 0 calc(var(--gb) + 14px); display: flex; flex-direction: column; gap: 8px; background: var(--sup); box-shadow: 0 -12px 12px -12px var(--sombra); }
.pastilla { display: flex; align-items: center; gap: 8px; flex: none; }
.pastilla .salir { height: 48px; min-width: 72px; display: flex; align-items: center; justify-content: center; padding: 0 16px; border-radius: 24px; background: var(--chip); border: 2px solid rgba(255, 255, 255, .85); color: #fff; font-size: 16px; font-weight: 700; }
.letra-grande .pastilla .salir { font-size: 26px; }
.letra-grande .estado-red { font-size: 24px; height: auto; min-height: 40px; }
.letra-grande .estado-red .det { display: none; }
[data-tam="chico"].letra-grande .quien { flex-wrap: nowrap; }
[data-tam="chico"].letra-grande .estado-red .que { display: none; }
.letra-grande .pantalla h1 { font-size: 34px; }
.letra-grande .pantalla .lead, .letra-grande .ficha { font-size: 22px; }
.aviso-cierre { position: absolute; z-index: 35; left: 12px; right: 12px; bottom: calc(var(--gb) + 72px); display: flex; align-items: center; gap: 12px; padding: 8px 8px 8px 16px; border-radius: 18px; background: #2b2f33; color: #fff; font-size: 16px; box-shadow: 0 6px 22px rgba(0, 0, 0, .35); }
.aviso-cierre span { flex: 1; min-width: 0; }
.aviso-cierre .btn { flex: none; }
.aviso-fijo { display: flex; align-items: center; gap: 8px; margin: 0 0 8px; padding: 4px 4px 4px 12px; min-height: 48px; border-radius: 14px; background: var(--sup-2); font-size: 14px; }
.aviso-fijo span { flex: 1; min-width: 0; }
.aviso-fijo .btn { min-height: 48px; padding: 0 14px; font-size: 14px; }
.fichas.rejilla { display: grid; grid-template-columns: repeat(3, 1fr); justify-items: center; gap: 12px 8px; }
.ficha-sola { display: flex; align-items: center; justify-content: center; gap: 12px; margin: 8px 0 4px; }
.ficha-sola .letra { width: 48px; height: 48px; border-radius: 50%; display: grid; place-items: center; background: var(--pri); color: var(--en-pri); font-size: 21px; font-weight: 700; }
.ficha-sola .btn { min-height: 48px; }

/* ——— El panel de abajo ——— */
.panel { position: absolute; z-index: 10; left: 0; right: 0; bottom: 0; top: calc(var(--sb) + (100% - var(--sb) - var(--gb) - 80px) * .68 + 10px); display: flex; flex-direction: column; background: var(--sup); color: var(--texto); border-radius: 24px 24px 0 0; box-shadow: 0 -8px 24px rgba(0, 0, 0, .3); padding-bottom: var(--gb); }
.modo-ticket { --m: var(--pri); --en-m: var(--en-pri); --m-c: var(--pri-c); --en-m-c: var(--en-pri-c); }
.modo-precio { --m: var(--precio); --en-m: var(--en-precio); --m-c: var(--precio-c); --en-m-c: var(--en-precio-c); }
.modo-conteo { --m: var(--conteo); --en-m: var(--en-conteo); --m-c: var(--conteo-c); --en-m-c: var(--en-conteo-c); }
.asidero { display: block; width: 100%; height: 18px; flex: none; position: relative; }
.asidero::after { content: ""; position: absolute; left: 50%; top: 7px; width: 36px; height: 4px; margin-left: -18px; border-radius: 2px; background: var(--borde); }
.cuerpo { flex: 1; min-height: 0; overflow: auto; padding: 0 max(16px, env(safe-area-inset-right, 0px)) 4px max(16px, env(safe-area-inset-left, 0px)); }
.acciones { flex: none; display: flex; gap: 8px; padding: 6px max(16px, env(safe-area-inset-right, 0px)) 6px max(16px, env(safe-area-inset-left, 0px)); }
.modos { flex: none; display: flex; justify-content: center; gap: 4px; padding: 2px max(16px, env(safe-area-inset-right, 0px)) 6px max(16px, env(safe-area-inset-left, 0px)); border-top: 1px solid var(--linea); }
.modos { padding-right: calc(max(16px, env(safe-area-inset-right, 0px)) + 68px) !important; justify-content: flex-start; }
.zurdo .modos { padding-right: max(16px, env(safe-area-inset-right, 0px)) !important; padding-left: calc(max(16px, env(safe-area-inset-left, 0px)) + 68px) !important; justify-content: flex-end; }
.modos .con-cuenta { position: relative; }
.modos .cuenta-ic { position: absolute; left: calc(50% - 26px); top: 4px; min-width: 18px; height: 18px; padding: 0 5px; border-radius: 9px; background: var(--pri); color: var(--en-pri); font-size: 11px; font-weight: 700; display: grid; place-items: center; }

/* ——— El botón rápido: abajo a la derecha, al final de la barra de modos. Pulsar abre tres botones chicos; pulsar,
   deslizar y soltar elige uno. Mide 56 dp; las opciones, 48 dp a 88 dp de su centro (↑ 90°, ↖ 135°, ← 180°) ——— */
.rapido { position: absolute; z-index: 31; right: max(16px, env(safe-area-inset-right, 0px)); bottom: calc(var(--gb) + 4px); width: 56px; height: 56px; }
.rapido .fab { position: absolute; inset: 0; border-radius: 16px; display: grid; place-items: center; background: var(--m); color: var(--en-m); box-shadow: 0 4px 12px var(--sombra); touch-action: none; user-select: none; -webkit-user-select: none; -webkit-touch-callout: none; }
.rapido .fab::before { content: ""; position: absolute; inset: -4px; }
.rapido .fab svg { width: 28px; height: 28px; stroke-width: 2.4; }
.hoja.recien .pie .btn.lleno { animation: enciende .3s steps(1, end) both; }
@keyframes enciende { from { opacity: .45; } to { opacity: 1; } }
.rapido .fab .i-cerrar, .rapido.abierto .fab .i-abanico { display: none; }
.rapido.abierto .fab .i-cerrar { display: block; }
.zurdo .rapido .fab .i-abanico { transform: scaleX(-1); }
.rapido.cancela .fab { box-shadow: 0 0 0 3px var(--m-c), 0 4px 12px var(--sombra); }
.rapido .op { position: absolute; left: 4px; top: 4px; width: 48px; height: 48px; opacity: 0; pointer-events: none; transform: translate(0, 0) scale(.5); transition: transform .15s ease-out, opacity .12s; }
.rapido.abierto .op { opacity: 1; pointer-events: auto; }
.rapido.abierto .op.arriba { transform: translate(0, -88px); }
.rapido.abierto .op.diagonal { transform: translate(-62px, -62px); }
.rapido.abierto .op.izquierda { transform: translate(-88px, 0); }
.rapido .op .circ { position: absolute; inset: 0; border-radius: 50%; display: grid; place-items: center; background: var(--sup); color: var(--texto); box-shadow: 0 2px 10px var(--sombra), inset 0 0 0 1.5px var(--borde); transition: transform .1s, background .1s; }
.rapido .op .etq-op { position: absolute; right: calc(100% + 8px); top: 50%; transform: translateY(-50%); white-space: nowrap; height: 32px; display: flex; align-items: center; padding: 0 12px; border-radius: 16px; background: var(--sup); color: var(--texto); font-size: 14.5px; font-weight: 600; box-shadow: 0 2px 10px var(--sombra); pointer-events: none; }
.rapido .op.arriba .etq-op { right: 0; top: auto; bottom: calc(100% + 8px); transform: none; }
.rapido .op.sel .circ, .rapido .op:focus-visible .circ { transform: scale(1.17); background: var(--m); color: var(--en-m); box-shadow: 0 4px 14px var(--sombra); }
.rapido .op.sel .etq-op { background: var(--m); color: var(--en-m); }
.rapido.abierto .op:disabled { opacity: .45; }
.rapido .op .cuenta-op { position: absolute; right: -4px; top: -4px; min-width: 20px; height: 20px; padding: 0 5px; border-radius: 10px; background: var(--pri); color: var(--en-pri); font-size: 12px; font-weight: 700; display: grid; place-items: center; }
/* El velo atenúa solo el panel: la franja y la cámara siguen a la vista. Sobre el visor, una capa invisible cierra el menú */
.velo-rapido { position: absolute; z-index: 30; left: 0; right: 0; bottom: 0; top: calc(var(--sb) + (100% - var(--sb) - var(--gb) - 80px) * .68 + 10px); border-radius: 24px 24px 0 0; background: var(--velo); opacity: 0; pointer-events: none; transition: opacity .12s; }
.cierra-visor { position: absolute; z-index: 30; left: 0; right: 0; top: 0; bottom: calc(100% - var(--sb) - (100% - var(--sb) - var(--gb) - 80px) * .68 - 10px); display: none; }
.app.menu-abierto .velo-rapido { opacity: 1; pointer-events: auto; }
.app.menu-abierto .cierra-visor { display: block; }
.pista-rapido { position: absolute; z-index: 29; right: calc(max(16px, env(safe-area-inset-right, 0px)) + 4px); bottom: calc(var(--gb) + 72px); max-width: 240px; padding: 8px 12px; border-radius: 12px; background: #2b3135; color: #eef2f5; font-size: 13.5px; line-height: 1.35; box-shadow: 0 4px 14px rgba(0, 0, 0, .3); pointer-events: none; }
.pista-rapido::after { content: ""; position: absolute; right: 22px; bottom: -6px; width: 12px; height: 12px; background: #2b3135; transform: rotate(45deg); }
.app.menu-abierto .pista-rapido { display: none; }
.panel.modo-conteo ~ .pista-rapido { bottom: calc(var(--gb) + 124px); }
.pista-deslizar { position: absolute; z-index: 32; right: calc(max(16px, env(safe-area-inset-right, 0px)) + 4px); bottom: calc(var(--gb) + 200px); padding: 6px 12px; border-radius: 12px; background: #2b3135; color: #eef2f5; font-size: 13px; display: none; pointer-events: none; }
.app.menu-abierto .pista-deslizar.ver { display: block; }
/* «Ver el gesto» (prototipo): el círculo de 32 dp y las fronteras de los sectores, desde donde se pulsó */
.trazo-gesto { position: absolute; z-index: 33; width: 0; height: 0; pointer-events: none; }
.trazo-gesto svg { position: absolute; left: -120px; top: -120px; width: 240px; height: 240px; overflow: visible; }
/* Zurdos: el botón al principio de la barra y las direcciones en espejo (↑ ↗ →) */
.zurdo .rapido { right: auto; left: max(16px, env(safe-area-inset-left, 0px)); }
.zurdo .rapido.abierto .op.diagonal { transform: translate(62px, -62px); }
.zurdo .rapido.abierto .op.izquierda { transform: translate(88px, 0); }
.zurdo .rapido .op .etq-op { right: auto; left: calc(100% + 8px); }
.zurdo .rapido .op.arriba .etq-op { left: 0; right: auto; }
.zurdo .pista-rapido, .zurdo .pista-deslizar { right: auto; left: calc(max(16px, env(safe-area-inset-left, 0px)) + 4px); }
.zurdo .pista-rapido::after { right: auto; left: 22px; }
.modos button { flex: 1; max-width: 140px; height: 52px; margin-top: 4px; border-radius: 26px; display: flex; align-items: center; justify-content: center; gap: 6px; color: var(--suave); font-size: 15px; font-weight: 500; }
.modos button.on { background: var(--m-c); color: var(--en-m-c); font-weight: 700; }
.modos button.on[data-v="ticket"] { --m-c: var(--pri-c); --en-m-c: var(--en-pri-c); }
.modos .cuenta { min-width: 20px; height: 20px; padding: 0 6px; border-radius: 10px; background: var(--pri); color: var(--en-pri); font-size: 12px; font-weight: 700; display: inline-grid; place-items: center; }

.encabezado { display: flex; align-items: baseline; gap: 8px; min-height: 30px; }
.encabezado .titulo { font-size: 15px; font-weight: 600; color: var(--suave); }
.encabezado .titulo b { color: var(--texto); }
.encabezado .espacio { flex: 1; }
.encabezado .total { font-size: 24px; font-weight: 700; }
.vacio { color: var(--suave); padding: 8px 2px; font-size: 16px; }
.vacio strong { display: block; color: var(--texto); font-size: 18px; margin-bottom: 2px; }

.btn { min-height: 56px; border-radius: 28px; padding: 0 18px; display: inline-flex; align-items: center; justify-content: center; gap: 8px; font-size: 16px; font-weight: 600; white-space: nowrap; }
.btn.lleno { background: var(--m, var(--pri)); color: var(--en-m, var(--en-pri)); }
.btn.tonal { background: var(--sup-2); color: var(--texto); }
.btn.borde { border: 1.5px solid var(--borde); color: var(--texto); }
.btn.peligro { background: var(--error-c); color: var(--en-error-c); }
.btn.ancho { width: 100%; }
.btn.crece { flex: 1; min-width: 0; }
.btn:disabled { opacity: .42; }
.btn .sub { font-weight: 500; opacity: .85; }
.btn-ic { width: 48px; height: 48px; border-radius: 50%; display: grid; place-items: center; flex: none; }
.btn-ic:hover { background: var(--sup-2); }
.burbuja { min-width: 22px; height: 22px; padding: 0 6px; border-radius: 11px; background: var(--pri); color: var(--en-pri); font-size: 12.5px; font-weight: 700; display: inline-grid; place-items: center; }
/* En los celulares angostos, los botones de al lado se quedan con el icono (y su número) */
.telefono { container-type: inline-size; }
@container (max-width: 400px) {
  .acciones .etq { display: none; }
  .acciones .btn { padding: 0 14px; }
  .modos button { font-size: 14px; }
  .panel .tarjeta-precio { grid-template-columns: 60px minmax(0, 1fr); gap: 12px; }
  .panel .foto.g { width: 60px; height: 60px; border-radius: 12px; }
  .panel .tarjeta-precio .nombre { font-size: 16.5px; }
  .panel .tarjeta-precio .debajo { display: none; }
  .panel .tarjeta-precio .monto b { font-size: 34px; }
  .panel .contador { min-width: 92px; height: 64px; font-size: 38px; border-radius: 18px; }
  .panel .contador small { font-size: 20px; }
  .panel .contando .nom { font-size: 16px; -webkit-line-clamp: 1; display: -webkit-box; -webkit-box-orient: vertical; overflow: hidden; }
}

/* Renglones del ticket: el actual en dos filas (nombre e importe; precio y − cantidad +), los demás en una */
.lineas { display: flex; flex-direction: column; gap: 2px; }
.linea { display: grid; grid-template-columns: 44px minmax(0, 1fr) auto; gap: 10px; align-items: center; padding: 8px 8px; border-radius: 16px; }
.linea.doble { grid-template-columns: 44px minmax(0, 1fr); align-items: start; row-gap: 2px; }
.linea.doble .foto { grid-row: span 2; margin-top: 2px; }
.linea .fila1, .linea .fila2 { display: flex; align-items: center; gap: 8px; min-width: 0; }
.linea .fila1 { align-items: flex-start; }
.linea .fila1 .nom { flex: 1; }
.linea .fila2 .det { flex: 1; min-width: 0; flex-wrap: nowrap; overflow: hidden; white-space: nowrap; }
.linea.actual { background: var(--m-c); color: var(--en-m-c); animation: brilla .9s ease-out; }
@keyframes brilla { from { box-shadow: 0 0 0 3px var(--m); } }
.linea .txt { min-width: 0; }
.linea .nom { font-size: 16px; font-weight: 600; line-height: 1.25; overflow: hidden; text-overflow: ellipsis; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; }
.linea.compacta .nom { -webkit-line-clamp: 1; font-weight: 500; }
.linea .det { font-size: 13.5px; color: var(--suave); display: flex; flex-wrap: wrap; align-items: center; gap: 2px 8px; }
.linea.actual .det { color: inherit; opacity: .9; }
.linea .der { display: flex; align-items: center; gap: 8px; }
.linea .imp { font-weight: 700; font-size: 16px; min-width: 60px; text-align: right; }
.linea .x { font-weight: 700; color: var(--suave); }
.linea.desconocido .nom { color: var(--error); }
.linea.desconocido.actual { background: var(--error-c); color: var(--en-error-c); }
.linea.desconocido.actual .nom { color: inherit; }
.panel .linea.doble.desconocido .nom { -webkit-line-clamp: 2; }
.linea.desconocido .fila2 .det { white-space: normal; }
/* En el panel de abajo, el nombre en un renglón: el completo se ve en el ticket o en el precio */
.panel .linea.doble .nom { -webkit-line-clamp: 1; }
.paso { display: inline-flex; align-items: center; border-radius: 26px; background: var(--sup); box-shadow: inset 0 0 0 1.5px var(--borde); }
.paso button { width: 48px; height: 48px; display: grid; place-items: center; border-radius: 24px; }
.paso .n { width: auto; min-width: 48px; padding: 0 2px; font-weight: 700; font-size: 18px; }
.marca-mayoreo { display: inline-flex; align-items: center; height: 20px; padding: 0 7px; border-radius: 10px; font-size: 12px; font-weight: 600; background: var(--exito-c); color: var(--en-exito-c); }
.marca-quedan { display: inline-flex; align-items: center; height: 20px; padding: 0 7px; border-radius: 10px; font-size: 12px; font-weight: 600; background: var(--aviso-c); color: var(--aviso); }
.minis { display: inline-flex; gap: 3px; }
.minis svg { width: 16px; height: 21px; border-radius: 2px; box-shadow: 0 0 0 1px var(--linea); }

/* Fotos de los productos (dibujos) y miniaturas de las impresiones */
.foto { width: 44px; height: 44px; border-radius: 10px; background: var(--sup-1); color: var(--suave); display: grid; place-items: center; overflow: hidden; flex: none; }
.foto svg { width: 100%; height: 100%; }
.foto svg.i { width: 24px; height: 24px; }
.foto.g { width: 88px; height: 88px; border-radius: 16px; }
.mini { position: relative; aspect-ratio: 85 / 110; width: 100%; border-radius: 6px; overflow: hidden; background: #fff; box-shadow: 0 0 0 1px var(--linea); }
.mini svg { display: block; width: 100%; height: 100%; }
.mini.bn svg { filter: grayscale(1); }

/* Precio */
.tarjeta-precio { display: grid; grid-template-columns: 88px minmax(0, 1fr); gap: 14px; align-items: start; padding: 4px 0 0; }
.tarjeta-precio .monto { flex-wrap: wrap; row-gap: 4px; }
.monto .al-ticket { margin-left: auto; align-self: center; min-height: 48px; padding: 0 14px 0 10px; font-size: 15px; }
.tarjeta-precio .nombre { font-size: 18px; font-weight: 600; line-height: 1.25; }
.tarjeta-precio .debajo { font-size: 13.5px; color: var(--suave); margin-top: 2px; }
.tarjeta-precio .monto { display: flex; align-items: baseline; gap: 10px; margin-top: 4px; }
.tarjeta-precio .monto b { font-size: 40px; line-height: 1.1; font-weight: 700; color: var(--texto); letter-spacing: -.01em; }
.tarjeta-precio .monto small { font-size: 14px; color: var(--suave); }
.datos-precio { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 6px; }
.dato { display: inline-flex; align-items: center; gap: 6px; min-height: 30px; padding: 4px 10px; border-radius: 15px; background: var(--sup-1); font-size: 14px; }
.dato.mayoreo { background: var(--exito-c); color: var(--en-exito-c); }
.dato.promo { background: var(--m-c); color: var(--en-m-c); }
.dato.poco { background: var(--aviso-c); color: var(--aviso); font-weight: 600; }
.no-esta { display: flex; gap: 12px; align-items: flex-start; padding: 6px 0; }
.no-esta .ic { width: 44px; height: 44px; border-radius: 50%; display: grid; place-items: center; background: var(--error-c); color: var(--en-error-c); flex: none; }
.no-esta strong { display: block; font-size: 18px; }
.precio-grande { position: absolute; inset: 0; z-index: 30; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 12px; padding: 24px; background: #fffdf7; color: #1d1a12; text-align: center; }
.precio-grande .n { font-size: 26px; font-weight: 600; line-height: 1.2; text-wrap: balance; }
.precio-grande .m { font-size: 96px; line-height: 1; font-weight: 800; letter-spacing: -.02em; }
.precio-grande .y { font-size: 20px; color: #5a5242; }

/* Conteo */
.contando { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 4px 12px; align-items: center; }
.contando .nom { font-size: 17px; font-weight: 600; line-height: 1.25; }
.contando .det { font-size: 13.5px; color: var(--suave); }
.contador { grid-row: span 2; min-width: 112px; height: 84px; padding: 0 14px; border-radius: 22px; background: var(--m-c); color: var(--en-m-c); display: flex; align-items: center; justify-content: center; gap: 2px; font-size: 48px; font-weight: 800; line-height: 1; }
.contador small { font-size: 26px; font-weight: 600; opacity: .7; margin-right: 2px; }
.cuenta-grande { grid-row: span 2; display: flex; align-items: center; gap: 8px; }
.menos-uno { min-width: 52px; height: 52px; padding: 0 8px; border-radius: 26px; display: grid; place-items: center; background: var(--sup-2); color: var(--texto); flex: none; font-size: 16px; font-weight: 700; }
.menos-uno:disabled { opacity: .4; }
.cuenta-grande { position: relative; }
/* Conteo: el encabezado con el lugar, el producto que se toca entero, el aviso en su lugar y el renglón de lo último */
.encabezado.conteo { align-items: center; gap: 6px; }
.encabezado .lugar { display: inline-flex; align-items: center; gap: 2px; min-height: 40px; padding: 0 6px 0 12px; border-radius: 20px; background: var(--m-c); color: var(--en-m-c); font-size: 14px; font-weight: 700; flex: none; }
.encabezado .lugar svg.i { width: 18px; height: 18px; }
.encabezado .avance { min-height: 40px; color: var(--suave); font-size: 13.5px; white-space: nowrap; }
.encabezado .corto { display: none; min-height: 40px; }
.contando > .producto-toca { grid-column: 1; grid-row: 1; }
.contando > .cuenta-grande { grid-column: 2; grid-row: 1; }
.producto-toca { display: flex; flex-direction: column; align-items: flex-start; gap: 1px; min-width: 0; min-height: 48px; padding: 2px 0; text-align: left; }
.producto-toca .nom { max-width: 100%; font-size: 17px; font-weight: 600; line-height: 1.25; }
.producto-toca .det { max-width: 100%; font-size: 13.5px; color: var(--suave); line-height: 1.3; }
.producto-toca .suma { position: static; display: inline-block; flex: none; }
.panel .contando .producto-toca .nom { display: flex; align-items: baseline; gap: 6px; -webkit-line-clamp: unset; overflow: visible; }
.producto-toca .nom .n { min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.producto-toca .chip-para { margin: 2px 0; }
@container (max-width: 400px) { .producto-toca .det { max-width: 100%; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; } }
.zurdo .contando { grid-template-columns: auto minmax(0, 1fr); }
.zurdo .contando > .cuenta-grande { grid-column: 1; flex-direction: row-reverse; }
.zurdo .contando > .producto-toca { grid-column: 2; }
.aviso-conteo { margin-top: 6px; padding: 8px 6px 8px 12px; border-radius: 16px; }
.aviso-conteo.error { background: var(--error-c); color: var(--en-error-c); }
.aviso-conteo.otro { background: var(--aviso-c); color: var(--aviso); }
.aviso-conteo .fila-aviso { display: flex; align-items: flex-start; gap: 8px; }
.aviso-conteo .ic { flex: none; padding-top: 3px; }
.aviso-conteo .txt { flex: 1; min-width: 0; padding-top: 2px; font-size: 14.5px; line-height: 1.25; }
.aviso-conteo.error { padding: 6px 4px 6px 12px; }
.aviso-conteo.error .ic { display: none; }
.aviso-conteo .txt b { display: block; font-size: 16px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.aviso-conteo .txt.una { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; font-size: 15px; }
.aviso-conteo .txt.una b { display: inline; font-size: 15px; }
.aviso-conteo.otro { margin-top: 2px; padding: 4px 4px 4px 12px; }
.aviso-conteo.otro .ic { display: none; }
.aviso-conteo.otro .acciones-aviso { margin-top: 4px; }
.encabezado .lugar, .encabezado .avance, .encabezado .corto { position: relative; }
.encabezado .lugar::before, .encabezado .avance::before, .encabezado .corto::before { content: ""; position: absolute; inset: -4px 0; }
.aviso-conteo .acciones-aviso { display: flex; gap: 8px; margin-top: 8px; }
.aviso-conteo .acciones-aviso .btn { min-height: 48px; padding: 0 10px; font-size: 14.5px; white-space: normal; line-height: 1.15; }
.renglon-ultimo { flex: none; display: flex; align-items: center; gap: 8px; min-height: 48px; padding-block: 0 !important; margin: 0 max(12px, env(safe-area-inset-right, 0px)) 4px max(12px, env(safe-area-inset-left, 0px)); padding: 0 4px 0 12px; border-radius: 14px; background: var(--sup-1); font-size: 14.5px; }
.renglon-ultimo .txt { flex: 1; min-width: 0; display: flex; white-space: nowrap; overflow: hidden; }
.letra-grande .renglon-ultimo .txt { flex-wrap: wrap; white-space: normal; line-height: 1.15; align-content: center; padding-block: 2px; }
.letra-grande .renglon-ultimo .txt .nom { white-space: nowrap; flex: 1 1 0; }
.letra-grande .renglon-ultimo .txt .nom ~ .fijo { flex-basis: 100%; }
.renglon-ultimo .txt .nom { min-width: 0; overflow: hidden; text-overflow: ellipsis; }
.renglon-ultimo .txt .fijo, .renglon-ultimo .txt .dp { flex: none; }
.renglon-ultimo .btn { flex: none; min-height: 48px; padding: 0 14px; font-size: 14px; border-radius: 14px; }
.renglon-ultimo.regla { color: var(--suave); }
.renglon-ultimo.pregunta, .renglon-ultimo.vencido { background: var(--aviso-c); color: var(--aviso); font-weight: 600; }
.renglon-ultimo.aplicado { background: var(--exito-c); color: var(--en-exito-c); font-weight: 600; }
.zurdo .renglon-ultimo { flex-direction: row-reverse; padding: 0 12px 0 4px; }
.modos .cuenta-ic.aviso { background: var(--aviso); color: var(--aviso-c); }
.dato.oculta { flex-wrap: wrap; }

/* El teclado de contar: casillas en dos columnas y teclas de 52 dp; se cierra jalando su barra */
.cajas.dos { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }

.jalar { display: block; flex: none; width: 100%; height: 22px; position: relative; }

/* Lo contado y «¿Qué vas a contar?» */

/* Letra grande en Conteo: primero la barra y la pista; luego el encabezado corto; al último el desglose y «Ya van» */

.letra-grande .captura .det, .letra-grande .tarea small { font-size: 17px; }
.letra-grande .pestanas button { font-size: 18px; }
.suma { position: absolute; z-index: 1; right: -6px; bottom: -10px; padding: 2px 9px; border-radius: 11px; background: var(--m); color: var(--en-m); font-size: 14px; font-weight: 800; animation: entra .15s ease-out; pointer-events: none; }
.chip-para { display: inline-flex; align-items: center; height: 22px; max-width: 100%; padding: 0 8px; border-radius: 11px; background: var(--aviso-c); color: var(--aviso); font-size: 12.5px; font-weight: 600; white-space: nowrap; vertical-align: middle; }

.captura.falta { width: 100%; text-align: left; }

.nota.pendiente { color: var(--aviso); font-weight: 600; }

.progreso { height: 6px; border-radius: 3px; background: var(--sup-2); overflow: hidden; margin-top: 4px; }

/* Hojas (lo que se abre encima) */

.hoja .barra { flex: none; display: flex; align-items: center; gap: 4px; min-height: 60px; padding: 6px max(8px, env(safe-area-inset-right, 0px)) 6px max(8px, env(safe-area-inset-left, 0px)); }

.hoja .desliza { flex: 1; min-height: 0; overflow: auto; padding: 0 max(16px, env(safe-area-inset-right, 0px)) 12px max(16px, env(safe-area-inset-left, 0px)); }
.hoja .pie { flex: none; padding: 10px max(16px, env(safe-area-inset-right, 0px)) 12px max(16px, env(safe-area-inset-left, 0px)); border-top: 1px solid var(--linea); display: flex; flex-direction: column; gap: 8px; }
.nota { font-size: 13.5px; color: var(--suave); }
.nota.centro { text-align: center; }
.fila-total { display: flex; align-items: baseline; justify-content: space-between; gap: 8px; }
.fila-total span { color: var(--suave); }
.fila-total b { font-size: 28px; }
.seccion { margin: 14px 0 6px; font-size: 12px; font-weight: 700; letter-spacing: .07em; text-transform: uppercase; color: var(--tenue); }
.agregar { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 10px; }

/* Mandar a una caja */
.cajas { display: flex; flex-direction: column; gap: 8px; }
.caja { display: grid; grid-template-columns: 28px minmax(0, 1fr) auto; gap: 12px; align-items: center; min-height: 72px; padding: 10px 14px; border-radius: 18px; background: var(--sup-1); text-align: left; box-shadow: inset 0 0 0 2px transparent; }
.caja.on { box-shadow: inset 0 0 0 2px var(--m, var(--pri)); background: var(--m-c, var(--pri-c)); color: var(--en-m-c, var(--en-pri-c)); }
.caja:disabled strong, .caja:disabled small { color: var(--tenue); }
.caja:disabled .radio { opacity: .5; }
.caja .radio { width: 22px; height: 22px; border-radius: 50%; box-shadow: inset 0 0 0 2px var(--borde); }

.caja strong { display: block; font-size: 17px; }

.caja .esperan { font-size: 13px; font-weight: 600; padding: 4px 10px; border-radius: 12px; background: var(--sup-2); white-space: nowrap; }

/* Enviado / QR */
.enviado { display: flex; gap: 12px; align-items: center; padding: 8px 10px; border-radius: 16px; background: var(--exito-c); color: var(--en-exito-c); }
.enviado .ic { width: 44px; height: 44px; border-radius: 50%; background: var(--exito); color: #fff; display: grid; place-items: center; flex: none; }
.enviado strong { display: block; font-size: 17px; }
.qr-pantalla { position: absolute; inset: 0; z-index: 35; display: flex; flex-direction: column; align-items: center; gap: 14px; padding: calc(var(--sb) + 18px) 24px calc(var(--gb) + 18px); background: #ffffff; color: #111; text-align: center; }
.qr-pantalla h2 { margin: 0; font-size: 22px; }
.qr-pantalla p { margin: 0; color: #444; font-size: 15px; }
.qr-pantalla .qr { width: min(82%, 330px); aspect-ratio: 1; }
.qr-pantalla .qr svg { width: 100%; height: 100%; }
.qr-pantalla .botones { margin-top: auto; width: 100%; display: flex; flex-direction: column; gap: 8px; }
.qr-pantalla .btn.tonal { background: #ececec; color: #111; }
.qr-pantalla .btn.lleno { background: #1d5c7a; color: #fff; }

/* Buscar */
.resultados { display: flex; flex-direction: column-reverse; gap: 2px; }
.resultado { display: grid; grid-template-columns: 44px minmax(0, 1fr) auto; gap: 12px; align-items: center; min-height: 64px; padding: 8px 8px; border-radius: 14px; text-align: left; }

.resultado .nom mark { background: none; color: inherit; font-weight: 800; }
.resultado .det { display: block; font-size: 13.5px; color: var(--suave); }
.resultado .pre { font-weight: 700; font-size: 16px; text-align: right; }
.resultado .pre small { display: block; font-weight: 500; font-size: 12.5px; color: var(--suave); }
.campo { display: flex; align-items: center; gap: 8px; height: 56px; padding: 0 6px 0 16px; border-radius: 28px; background: var(--sup-1); box-shadow: inset 0 0 0 2px var(--m, var(--pri)); }
.campo input { flex: 1; min-width: 0; border: 0; background: none; outline: none; font-size: 17px; }

.sugeridos { display: flex; flex-wrap: wrap; gap: 8px; }
.sugerido { display: inline-flex; align-items: center; gap: 8px; min-height: 48px; padding: 6px 14px 6px 6px; border-radius: 24px; background: var(--sup-1); font-size: 15px; }

/* Teclado numérico (cantidad) */

.numerico { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }

/* Impresiones */
.chips { display: flex; gap: 8px; overflow-x: auto; padding: 2px 0 10px; }
.chip { flex: none; height: 48px; padding: 0 14px; border-radius: 20px; box-shadow: inset 0 0 0 1.5px var(--borde); font-size: 14.5px; font-weight: 500; display: inline-flex; align-items: center; gap: 6px; }
.chip.on { background: var(--pri-c); color: var(--en-pri-c); box-shadow: inset 0 0 0 1.5px var(--pri); font-weight: 700; }
.lote { margin-bottom: 14px; }

.lote-cabeza { display: flex; align-items: center; gap: 8px; margin-bottom: 8px; }

.trabajos { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px; }
.trabajo { position: relative; display: flex; flex-direction: column; gap: 6px; padding: 8px; border-radius: 16px; background: var(--sup-1); text-align: left; box-shadow: inset 0 0 0 2px transparent; }
.trabajo.on { box-shadow: inset 0 0 0 3px var(--pri); background: var(--pri-c); color: var(--en-pri-c); }
.trabajo:disabled { opacity: .55; }
.trabajo .marca { position: absolute; top: 14px; right: 14px; width: 30px; height: 30px; border-radius: 50%; display: grid; place-items: center; background: rgba(255, 255, 255, .92); color: transparent; box-shadow: 0 0 0 2px var(--borde); }

.trabajo .abajo { display: flex; justify-content: space-between; align-items: baseline; gap: 6px; font-size: 12.5px; color: var(--suave); }
.trabajo.on .abajo { color: inherit; }
.trabajo .abajo b { font-size: 16px; color: var(--texto); }
.trabajo.on .abajo b { color: inherit; }

/* Lo contado */
.capturas { display: flex; flex-direction: column; gap: 2px; }
.captura { display: grid; grid-template-columns: minmax(0, 1fr) auto auto; gap: 10px; align-items: center; min-height: 56px; padding: 6px 4px 6px 8px; border-bottom: 1px solid var(--linea); }
.captura .nom { font-size: 15.5px; font-weight: 500; line-height: 1.25; }
.captura .det { font-size: 13px; color: var(--suave); }
.captura .cant { font-size: 20px; font-weight: 800; }
.subida { display: inline-flex; align-items: center; gap: 3px; font-size: 12.5px; vertical-align: middle; }
.subida svg.i { width: 14px; height: 14px; }

/* Entrada, alta y menús */
.pantalla { position: absolute; inset: 0; display: flex; flex-direction: column; background: var(--sup); color: var(--texto); padding: calc(var(--sb) + 12px) max(20px, env(safe-area-inset-right, 0px)) calc(var(--gb) + 14px) max(20px, env(safe-area-inset-left, 0px)); overflow: auto; }
.pantalla h1 { margin: 8px 0 4px; font-size: 26px; font-weight: 600; text-wrap: balance; }
.pantalla .lead { margin: 0 0 14px; color: var(--suave); font-size: 16px; }
.fichas { display: flex; flex-wrap: wrap; gap: 14px; justify-content: center; margin: 10px 0 14px; }
.ficha { width: 92px; display: flex; flex-direction: column; align-items: center; gap: 6px; padding: 8px 4px; border-radius: 18px; font-size: 15px; }
.ficha .letra { width: 64px; height: 64px; border-radius: 50%; display: grid; place-items: center; font-size: 26px; font-weight: 700; background: var(--sup-2); }
.ficha.on { background: var(--pri-c); color: var(--en-pri-c); }

.puntos { display: flex; justify-content: center; gap: 16px; margin: 6px 0 4px; }
.puntos i { width: 16px; height: 16px; border-radius: 50%; box-shadow: inset 0 0 0 2px var(--borde); }
.puntos i.on { background: var(--pri); box-shadow: none; }
.pin-error { text-align: center; color: var(--error); min-height: 22px; font-size: 14.5px; }
.pantalla .numerico { margin-top: auto; }
.pantalla .numerico button { height: 64px; }
.paso-alta { display: flex; gap: 14px; align-items: flex-start; padding: 12px 0; border-bottom: 1px solid var(--linea); }
.paso-alta .n { width: 32px; height: 32px; border-radius: 50%; display: grid; place-items: center; background: var(--pri-c); color: var(--en-pri-c); font-weight: 700; flex: none; }
.paso-alta.hecho .n { background: var(--exito); color: #fff; }
.paso-alta strong { display: block; font-size: 16.5px; }
.paso-alta span { color: var(--suave); font-size: 14.5px; }
.dialogo { position: absolute; inset: 0; z-index: 50; display: grid; place-items: center; padding: 24px; background: rgba(0, 0, 0, .5); }
.dialogo > div { width: 100%; max-width: 330px; background: var(--sup-1); color: var(--texto); border-radius: 28px; padding: 22px 22px 12px; box-shadow: 0 10px 40px rgba(0, 0, 0, .4); }
.dialogo h3 { margin: 10px 0 8px; font-size: 21px; font-weight: 500; text-align: center; }
.dialogo p { margin: 0 0 12px; color: var(--suave); font-size: 14.5px; text-align: center; }
.dialogo .ic { display: grid; place-items: center; color: var(--pri); }
.dialogo .opciones { display: flex; flex-direction: column; gap: 4px; }
.dialogo .opciones button { min-height: 48px; border-radius: 24px; font-weight: 600; color: var(--pri); }
.dialogo.abajo { place-items: end stretch; padding: 0; }
.dialogo.abajo > div { max-width: none; border-radius: 28px 28px 0 0; padding: 18px 24px calc(var(--gb) + 10px); }
.sistema .app-sis { display: flex; align-items: center; justify-content: center; gap: 8px; color: var(--suave); font-size: 14px; }

.sistema .opciones { align-items: flex-start; }
.cabeza-entrada { display: flex; align-items: center; gap: 4px; margin: 0 0 4px -12px; }

.revocado .ic-grande { display: grid; place-items: center; width: 72px; height: 72px; margin: 0 auto 12px; border-radius: 50%; background: var(--error-c); color: var(--en-error-c); }
.revocado .ic-grande svg.i { width: 36px; height: 36px; }
.menu-lista { display: flex; flex-direction: column; }
.menu-lista button { display: flex; align-items: center; gap: 16px; min-height: 56px; padding: 0 8px; border-radius: 14px; text-align: left; font-size: 16.5px; }
.menu-lista button:hover { background: var(--sup-1); }

.yo { display: flex; align-items: center; gap: 14px; padding: 4px 4px 12px; border-bottom: 1px solid var(--linea); margin-bottom: 6px; }
.yo .letra { width: 52px; height: 52px; border-radius: 50%; display: grid; place-items: center; background: var(--pri); color: var(--en-pri); font-size: 22px; font-weight: 700; flex: none; }
.yo strong { display: block; font-size: 18px; }
.yo small { color: var(--suave); font-size: 14px; }
.ajuste { display: flex; align-items: center; gap: 12px; min-height: 60px; padding: 8px 0; border-bottom: 1px solid var(--linea); }
.ajuste div { flex: 1; min-width: 0; }
.ajuste strong { display: block; font-size: 16px; font-weight: 500; }
.ajuste small { color: var(--suave); font-size: 13.5px; }
.interruptor { width: 52px; height: 32px; border-radius: 16px; background: var(--sup-2); box-shadow: inset 0 0 0 2px var(--borde); position: relative; flex: none; }
.interruptor::after { content: ""; position: absolute; top: 8px; left: 8px; width: 16px; height: 16px; border-radius: 50%; background: var(--borde); transition: all .15s; }
.interruptor.on { background: var(--pri); box-shadow: none; }
.interruptor.on::after { left: 24px; top: 4px; width: 24px; height: 24px; background: var(--en-pri); }

/* El bloqueo */

/* Un EAN-13 de verdad, dibujado (para la etiqueta que «ve» la cámara) */
const EAN = {
  L: ['0001101', '0011001', '0010011', '0111101', '0100011', '0110001', '0101111', '0111011', '0110111', '0001011'],
  G: ['0100111', '0110011', '0011011', '0100001', '0011101', '0111001', '0000101', '0010001', '0001001', '0010111'],
  R: ['1110010', '1100110', '1101100', '1000010', '1011100', '1001110', '1010000', '1000100', '1001000', '1110100'],
  par: ['LLLLLL', 'LLGLGG', 'LLGGLG', 'LLGGGL', 'LGLLGG', 'LGGLLG', 'LGGGLL', 'LGLGLG', 'LGLGGL', 'LGGLGL'],
};
function barrasEan(codigo) {
  if (!/^\d{13}$/.test(codigo)) return '';
  const d = codigo.split('').map(Number);
  let bits = '101';
  for (let i = 1; i <= 6; i++) bits += EAN[EAN.par[d[0]][i - 1]][d[i]];
  bits += '01010';
  for (let i = 7; i <= 12; i++) bits += EAN.R[d[i]];
  bits += '101';
  let rects = '';
  for (let i = 0; i < bits.length; i++) if (bits[i] === '1') {
    const guarda = i < 3 || (i >= 45 && i < 50) || i >= 92;
    rects += `<rect x="${i + 7}" y="0" width="1" height="${guarda ? 46 : 41}" fill="#111"/>`;
  }
  const t = `<text y="54" font-size="8" font-family="monospace" fill="#111">`;
  return `<svg viewBox="0 0 109 56" aria-hidden="true">${rects}${t}<tspan x="0">${codigo[0]}</tspan><tspan x="13" letter-spacing="1.6">${codigo.slice(1, 7)}</tspan><tspan x="59" letter-spacing="1.6">${codigo.slice(7)}</tspan></text></svg>`;
}
/* Un QR dibujado (no se puede leer: es para ver el tamaño y la forma) */
function qrDibujo(semilla, n = 37) {
  let s = semilla;
  const azar = () => ((s = (s * 1103515245 + 12345) % 2147483648) / 2147483648);
  let r = '';
  const ojo = (x, y) => { r += `<rect x="${x}" y="${y}" width="7" height="7" fill="#111"/><rect x="${x + 1}" y="${y + 1}" width="5" height="5" fill="#fff"/><rect x="${x + 2}" y="${y + 2}" width="3" height="3" fill="#111"/>`; };
  for (let y = 0; y < n; y++) for (let x = 0; x < n; x++) {
    const enOjo = (x < 8 && y < 8) || (x > n - 9 && y < 8) || (x < 8 && y > n - 9);
    if (!enOjo && azar() > .52) r += `<rect x="${x}" y="${y}" width="1.02" height="1.02" fill="#111"/>`;
  }
  ojo(0, 0); ojo(n - 7, 0); ojo(0, n - 7);
  return `<svg viewBox="-2 -2 ${n + 4} ${n + 4}" shape-rendering="crispEdges" aria-hidden="true"><rect x="-2" y="-2" width="${n + 4}" height="${n + 4}" fill="#fff"/>${r}</svg>`;
}

/* ——— Cálculos del ticket (como la caja: el mayoreo entra solo al llegar a la escala) ——— */
function precioUnitario(p, cant) { return p.mayoreo && cant >= p.mayoreo[0] ? p.mayoreo[1] : p.precio; }
function importe(l) { const p = POR_CODIGO.get(l.codigo); return p ? precioUnitario(p, l.cant) * l.cant : 0; }
const trabajosElegidos = () => TRABAJOS.filter(t => S.impresiones.includes(t.id));
const totalImpresiones = () => trabajosElegidos().reduce((s, t) => s + t.precio, 0);
const totalTicket = () => S.ticket.reduce((s, l) => s + importe(l), 0) + totalImpresiones();
const piezasTicket = () => S.ticket.reduce((s, l) => s + l.cant, 0) + S.impresiones.length;
function recordar() { S.deshacer.push(JSON.stringify({ t: S.ticket, i: S.impresiones })); if (S.deshacer.length > 30) S.deshacer.shift(); }

function agregarAlTicket(codigo, cant = 1, aviso = false) {
  recordar();
  const i = S.ticket.findIndex(l => l.codigo === codigo);
  if (i >= 0) { const l = S.ticket.splice(i, 1)[0]; l.cant += cant; S.ticket.unshift(l); }
  else S.ticket.unshift({ id: S.idLinea++, codigo, cant, desconocido: !POR_CODIGO.has(codigo) });
  S.enviado = null; S.qr = null;
  if (aviso) {
    const p = POR_CODIGO.get(codigo), l = S.ticket.find(x => x.codigo === codigo), nom = p ? (p.nombre.length > 26 ? p.nombre.slice(0, 25).trimEnd() + '…' : p.nombre) : codigo;
    toast(`${nom} al ticket${l && l.cant > 1 ? ` (van ${l.cant})` : ''} · ${piezasTicket()} art. · ${dinero(totalTicket())}`, 'Deshacer', () => A.deshacer(), 4200, true);   // arriba: el botón queda libre
  }
}

/* ——— El escáner simulado: viendo (ámbar) → leído (verde, vibración) → escaneando ——— */
function siguienteCodigo(soloVer = false) {
  const m = S.pantalla === 'alta' ? null : (S.rapidoBloqueo ? 'precio' : S.modo);
  if (!m) return QR_ALTA;
  const sig = k => soloVer ? S.indices[k] : S.indices[k]++;
  if (m === 'conteo' && conteoActivo()) {
    const t = conteoActivo(), o = S.secuenciaConteo, sec = o && o.para === t.id ? SEC_CONTEO[o.sec] : (SEC_CONTEO[t.id] || SEC_CONTEO.esc);
    return sec[sig('conteo') % sec.length];
  }
  const sec = SECUENCIAS[m]; return sec[sig(m) % sec.length];
}
function leer(codigo) {
  if (S.escaner.fase !== 'escaneando') return;
  S.cierrePendiente = null;
  if (S.avisoCierre) S.avisoCierre = false;   // leer es usarlo: el aviso del minuto se va
  /* Con una hoja, el precio en grande, el QR o un diálogo encima, la lectura enseña su verde pero no cuenta ni vibra */
  const tapado = !!(S.hoja || S.precioGrande || S.qr || S.dialogo) && !S.rapidoBloqueo && S.pantalla !== 'alta';
  codigo = codigo || siguienteCodigo(tapado);
  S.escaner.fase = 'viendo'; S.escaner.codigo = codigo; pintarEscaner();
  despues(280, () => {
    S.escaner.fase = 'leido';
    if (!tapado) { vibrar(35); aplicarLectura(codigo); }
    pintar();
    despues(550, () => { S.escaner.fase = 'escaneando'; S.escaner.codigo = null; pintarEscaner(); });
  });
}
function aplicarLectura(codigo) {
  if (S.pantalla === 'alta') { S.pasoAlta = 1; return; }
  if (S.rapidoBloqueo || S.modo === 'precio') {
    S.precio = codigo;
    if (S.cerradaSola && S.cerradaSola.primera && !S.rapidoBloqueo) { S.cerradaSola.primera = false; toast('No se contó: estás en Precio.'); }
    return;
  }
  if (S.modo === 'ticket') { agregarAlTicket(codigo); return; }
  if (S.modo === 'conteo') contarLectura(codigo);
}
/* ——— Contar ———
   actual: lo que se cuenta ahora de un producto en este lugar, por presentación, con sus lecturas en orden para que el −
   quite la última. base: lo que ya se guardó de ese producto en este lugar, así la cuenta sigue al volver. En el del día,
   lo de cada lugar queda en dia[código].lugares hasta «Es todo» */
const LUGARES_CONTEO = ['Anaquel', 'Mostrador', 'Bodega'];
const redondo = n => Math.round(n * 100) / 100;
/* Las presentaciones de un producto, de la más grande a la suelta */
function presentaciones(p) {
  const l = [];

  else if (p.rollo) l.push({ k: 'rollo', nombre: `Rollos de ${p.rollo.metros} m`, corto: 'rollo', piezas: p.rollo.metros, codigo: p.rollo.codigo });
  l.push({ k: 'suelta', nombre: p.unidad === 'm' ? 'Metros sueltos' : 'Sueltas', corto: p.unidad === 'm' ? 'm' : 'suelta', piezas: 1 });
  return l;
}
const cuentasVacias = p => Object.fromEntries(presentaciones(p).map(x => [x.k, 0]));
const sumarCuentas = (a, b) => { const r = { ...(a || {}) }; for (const [k, v] of Object.entries(b || {})) r[k] = redondo((r[k] || 0) + v); return r; };
const piezasDeCuentas = (p, cu) => redondo(presentaciones(p).reduce((s, x) => s + ((cu && cu[x.k]) || 0) * x.piezas, 0));
const nuevasDe = a => piezasDeCuentas(POR_CODIGO.get(a.codigo), a.cuentas);
const piezasDe = a => redondo(a.base + nuevasDe(a));
const unidad = (p, n) => p.unidad === 'm' ? `${n} m` : `${n} ${n === 1 ? 'pieza' : 'piezas'}`;
function desglose(p, cu) {
  return presentaciones(p).filter(x => cu && cu[x.k]).map(x => x.k === 'suelta'
    ? (p.unidad === 'm' ? `${cu[x.k]} m sueltos` : `${cu[x.k]} ${cu[x.k] === 1 ? 'suelta' : 'sueltas'}`)
    : `${cu[x.k]} ${x.corto}${cu[x.k] === 1 ? '' : 's'}`).join(' + ');
}
const conteoActivo = () => CONTEOS.find(t => t.id === S.conteo.activo) || null;
const abiertoDe = depto => CONTEOS.find(x => x.tipo === 'completo' && x.depto === depto) || null;
const quienDice = q => PERSONAS[S.persona] && q === PERSONAS[S.persona].nombre ? 'tú' : q;
/* El reloj del prototipo: empieza a las 14:52, como la barra de estado; «Pasa: 10 min sin uso» lo adelanta */
const ARRANQUE = Date.now();
const ahoraMs = () => Date.now() + (S.minutosExtra || 0) * 60000;
const minutosDesde = t => Math.max(0, Math.floor((ahoraMs() - t) / 60000));
function horaAhora() { const m = 14 * 60 + 52 + Math.floor((ahoraMs() - ARRANQUE) / 60000); return `${Math.floor(m / 60) % 24}:${String(m % 60).padStart(2, '0')}`; }
const anunciar = t => { S.anuncio = t; };   // TalkBack: la región que se anuncia sola

/* Lo que no se cuenta, o lo de otro departamento, sale en el lugar del producto: nada flota sobre el panel de Conteo */
function avisar(tipo, texto, datos = {}) {

}
/* Lo de otro departamento que se dejó sin decidir no se pierde: pasa a lo contado › «Fuera de lugar» */
function moverAFuera() {
  const c = S.conteo, v = c.aviso;
  if (!v || v.tipo !== 'otro') return;
  if (!c.fuera.some(f => f.codigo === v.codigo)) c.fuera.push({ codigo: v.codigo, depto: v.depto, hora: horaAhora() });
  c.aviso = null;
}
function contarLectura(codigo) {
  const c = S.conteo, t = conteoActivo();
  if (!t) return;
  c.ultimaLectura = ahoraMs(); c.ultimoAplicado = null; c.quitada = null;
  const leido = POR_CODIGO.get(codigo);
  if (!leido || leido.rapido || leido.sinInventario) {
    moverAFuera();
    avisar('error', leido ? 'No lleva inventario: no se cuenta.' : 'No está en el catálogo: apártalo para el encargado.', { nombre: leido ? leido.nombre : codigo, desconocido: !leido });
    return;
  }
  const base = leido.base || codigo, p = POR_CODIGO.get(base);
  const pres = presentaciones(p).find(x => x.codigo === codigo) || presentaciones(p).find(x => x.k === 'suelta');
  const mismo = c.actual && c.actual.codigo === base;
  if (c.aviso && c.aviso.tipo === 'otro' && c.aviso.codigo !== base) moverAFuera();
  if (c.aviso && c.aviso.tipo === 'retomar' && c.aviso.codigo === base && !c.actual) { c.aviso = null; empezarProducto(base); }
  if (t.tipo === 'completo' && !mismo && p.depto !== t.depto && c.paraOtro !== p.depto) {
    dejarActual();
    if (abiertoDe(p.depto)) { avisar('otro', `Es de ${DEPTOS[p.depto]}, que también se está contando.`, { nombre: p.nombre, codigo: base, depto: p.depto, corto: `Es de ${DEPTOS[p.depto]}:` }); return; }
    if (CERRADOS[p.depto]) { avisar('error', `${DEPTOS[p.depto]} se contó el ${CERRADOS[p.depto]}: llévalo y avísale al encargado; es un ajuste.`, { nombre: p.nombre, codigo: base }); return; }
    avisar('error', `Es de ${DEPTOS[p.depto]}, que no se está contando. Llévalo a su lugar.`, { nombre: p.nombre, codigo: base });
    return;
  }
  if (t.tipo === 'dia' && !mismo) {
    const abierto = abiertoDe(p.depto), otro = DIA_DE_OTROS[base], d = c.dia[base];
    let no = '';
    if (!t.productos.includes(base)) no = 'No está en el conteo de hoy.';
    else if (abierto) no = `${abierto.titulo} se está contando completo; se cuenta ahí.`;
    else if (otro) no = `Ya lo contó ${quienDice(otro.quien)} a las ${otro.hora}.`;
    else if (d && d.estado !== 'sin-aplicar') no = 'Ya se contó hoy. Si quedó mal, es un ajuste en la caja.';

  a.cuentas[pres.k] = redondo((a.cuentas[pres.k] || 0) + 1); a.lecturas.push(pres.k);

  c.sumaHasta = Date.now() + 2400;
  despues(2500, () => { if (Date.now() >= S.conteo.sumaHasta) pintar(); });
  anunciar(`${p.nombre}, ${t.tipo === 'dia' ? totalDia(base) : piezasDe(a)}, ${c.suma.replace('+', 'más ')}`);

/* Empezar a contar un producto en este lugar. Lo de antes se guarda solo (completo) o queda sin aplicar (del día). Si ya se
   había guardado algo de ese producto en este lugar, la cuenta sigue desde ahí: «14 · 13 guardadas + 1» */
function empezarProducto(codigo) {
  const c = S.conteo, t = conteoActivo(), p = POR_CODIGO.get(codigo);
  const antes = c.capturas[0];
  dejarActual();
  const recien = c.capturas[0] !== antes ? c.capturas[0] : null;
  const para = t.tipo === 'completo' && p.depto !== t.depto ? p.depto : null;
  const destino = para ? (abiertoDe(para) || t) : t;

    base = redondo(mias.reduce((s, k) => s + k.cant, 0)); baseIds = mias.map(k => k.id);
    mias.forEach(k => { baseCuentas = sumarCuentas(baseCuentas, k.cuentas); });
    /* Una lectura de más en medio: el mismo producto vuelve antes de 30 s y en medio hubo una sola lectura de otro */
    const previa = recien && c.capturas[1];
    if (recien && recien.lecturas === 1 && recien.codigo !== codigo && previa && previa.codigo === codigo && ahoraMs() - previa.t < 30000) c.pregunta = recien.id;
  } else {
    const d = c.dia[codigo];
    base = d && d.lugares[c.lugar] ? d.lugares[c.lugar] : 0;
    baseCuentas = d && d.cuentasDe && d.cuentasDe[c.lugar] ? { ...d.cuentasDe[c.lugar] } : {};

/* Al escanear otro producto, cambiar de lugar o salir de Conteo: en el completo, lo de aquí se guarda solo; en el del día

function dejarActual() {

    if (aqui > 0 || a.tecleado) { d.lugares[a.lugar] = aqui; d.cuentasDe[a.lugar] = sumarCuentas(a.baseCuentas, a.cuentas); }
    else { delete d.lugares[a.lugar]; delete d.cuentasDe[a.lugar]; }

/* Una captura: lo de un lugar. reemplaza: lo tecleado es todo lo de este lugar (se quitan las guardadas y sube una) */
function guardarCaptura(a, reemplaza = false) {

/* El del día: el total de la tienda es lo de cada lugar; «Es todo» lo aplica, una sola vez */

function manchas() {

/* Los modos que deja este celular: el de la tienda, solo Precio y Conteo */

/* ——— El botón rápido: las tres opciones de cada modo, siempre en las mismas direcciones ———

function opcionesRapidas() {
  const m = S.modo;
  if (S.pantalla !== 'escaner' || S.rapidoBloqueo) return null;
  const buscar = { accion: 'buscar', icono: 'buscar', etiqueta: 'Buscar' };
  if (m === 'ticket') {
    const n = piezasTicket(), caja = CAJAS.find(x => x.id === S.cajaElegida);
    const hayImp = S.red === 'caida' ? 0 : TRABAJOS.filter(t => !S.impresiones.includes(t.id) && !t.revisar).length;
    return {
      arriba: { accion: 'mandar', icono: 'mandar', etiqueta: `Mandar a ${caja.nombre}`, apagada: !n, razon: 'Mandar: el ticket está vacío' },
      diagonal: { accion: 'impresiones', icono: 'imprimir', etiqueta: 'Impresiones', cuenta: hayImp, apagada: S.red === 'caida', razon: 'Impresiones: sin red no se ven; se agregan en la caja con F2' },
      izquierda: buscar,
    };
  }
  if (m === 'precio') {

    const hay = S.precio && POR_CODIGO.has(S.precio);
    return {
      arriba: { accion: 'agrandar', icono: 'agrandar', etiqueta: 'Enseñar al cliente', apagada: !hay, razon: 'Enseñar: primero escanea un producto' },
      diagonal: null,
      izquierda: buscar,
    };
  }
  if (m === 'conteo') {
    const c = S.conteo, t = conteoActivo();
    if (S.pos === 'piloto' && !S.verConteo || !t || !PERSONAS[S.persona]) return null;
    const dia = t.tipo === 'dia';
    const codigoDia = dia ? (c.actual ? c.actual.codigo : sinAplicar()[0]) : null;
    const n = dia ? (codigoDia ? totalDia(codigoDia) : 0) : (c.actual ? piezasDe(c.actual) : 0);
    const sinNuevo = !c.actual || (nuevasDe(c.actual) <= 0 && !c.actual.tecleado);
    return {
      arriba: dia ? { accion: 'guardarConteo', icono: 'check', etiqueta: `Es todo · ${n}`, apagada: !codigoDia, razon: 'Es todo: todavía no cuentas nada' }

      diagonal: { accion: 'verContado', icono: 'lista', etiqueta: 'Lo contado', cuenta: dia ? sinAplicar().length : c.fuera.length },

const FLECHAS_DIESTRO = { arriba: '↑', diagonal: '↖', izquierda: '←' }, FLECHAS_ZURDO = { arriba: '↑', diagonal: '↗', izquierda: '→' };

/* El renglón de lo último: fijo, de una línea, encima de los modos. No se va por tiempo ni lo tapa otro aviso */
function renglonConteo() {

  const r = (texto, boton = '', clase = '') => `<div class="renglon-ultimo ${clase}" role="status"><span class="txt">${texto}</span>${boton}</div>`;
  const t3 = (antes, nombre, despues) => `${antes ? `<span class="fijo">${antes}${antes === '¿' ? '' : '&nbsp;'}</span>` : ''}<span class="nom">${esc(nombre)}</span>${/^:/.test(String(despues)) ? `<span class="dp">:</span><span class="fijo">&nbsp;${String(despues).replace(/^:\s*/, '')}</span>` : `<span class="fijo">&nbsp;${despues}</span>`}`;
  const b = (etq, a, datos = '') => `<button class="btn tonal" data-a="${a}" ${datos}>${etq}</button>`;
  if (c.quitada) { const p = POR_CODIGO.get(c.quitada.codigo); return r(t3('Quitada:', p.nombre, c.quitada.cant === 0 ? 'no hay' : c.quitada.cant), b('Deshacer', 'deshacerQuitar')); }
  if (t.tipo === 'completo') {

    if (k) return r(t3('¿', POR_CODIGO.get(k.codigo).nombre, `(${k.cant}) fue de más?`), b('Quitar', 'quitarCaptura', `data-id="${k.id}" data-renglon="1"`), 'pregunta');
    const u = c.capturas.find(x => x.id === c.ultimaGuardada);
    if (u) {
      const p = POR_CODIGO.get(u.codigo), cant = u.cant === 0 ? 'no hay' : u.suma ? `+${u.cant} (${redondo(u.suma + u.cant)} aquí)` : u.cant;
      return r(t3('Antes:', p.nombre, `${cant}${u.estado === 'por-subir' ? ' · por subir' : ''}`), b('Quitar', 'quitarCaptura', `data-id="${u.id}" data-renglon="1"`));
    }

  }

    return r(t3(ap.porAplicar ? 'Por aplicar:' : 'Aplicado:', p.nombre, `${ap.total === 0 ? 'no hay' : ap.total}${ver && !ap.porAplicar ? ` · sistema ${ap.sistema} · ${ap.dif >= 0 ? '+' : '−'}${Math.abs(ap.dif)}` : ''}`), '', 'aplicado');

}

/* Buscar: el campo abajo, junto al pulgar y pegado al teclado; el mejor resultado queda junto al campo */
function buscarEn(q) {
  const piezas = sinAcentos(q).split(/\s+/).filter(Boolean);
  if (!piezas.length) return [];
  return TODOS.map(p => {
    if (p.codigo === q.trim()) return { p, r: 1e6 };
    const palabras = sinAcentos(p.nombre + ' ' + (DEPTOS[p.depto] || '') + ' ' + p.codigo).split(/[^a-z0-9ñ.]+/).filter(Boolean);
    if (!piezas.every(z => palabras.some(w => w.startsWith(z)))) return null;
    const empieza = sinAcentos(p.nombre).startsWith(piezas[0]) ? 1000 : 0;
    const elegido = S.elegidos.includes(p.codigo) ? 5000 : 0;
    return { p, r: elegido + empieza + p.vendidos };
  }).filter(Boolean).sort((a, b) => b.r - a.r).slice(0, 30).map(x => x.p);
}
function marcarPiezas(nombre, q) {
  const piezas = sinAcentos(q).split(/\s+/).filter(Boolean);
  return nombre.split(' ').map(w => { const z = piezas.find(z => sinAcentos(w).startsWith(z)); return z ? `<mark>${esc(w.slice(0, z.length))}</mark>${esc(w.slice(z.length))}` : esc(w); }).join(' ');
}

    <div class="qr">${qrDibujo(S.ticket.length * 17 + 3)}</div><p style="font-size:13px;color:#666">Lleva un renglón por producto, «2*7509990100019», como si el lector los escaneara uno tras otro: entran al ticket que la caja tenga abierto.${S.impresiones.length ? ' Las impresiones se agregan en la caja (F2).' : ''} (Dibujo: no se puede leer.)</p>

}

/* La cantidad tecleada. En el ticket, cuántas lleva (20 copias). En el conteo, una casilla por presentación, de la más
   grande a la suelta, como la página /conteo de hoy, con el total al momento; el punto solo para metros */
function hojaCantidad() {
  const d = S.hojaDatos;
  const p = POR_CODIGO.get(d.codigo);
  const tecladoDe = (teclas, cls = '') => `<div class="numerico${cls}">${teclas.map(k => k ? `<button class="${k === '⌫' ? 'op' : ''}" data-a="cifra" data-k="${k}" aria-label="${k === '⌫' ? 'Borrar' : k === '.' ? 'Punto' : k}">${k}</button>` : '<span></span>').join('')}</div>`;
  if (!d.conConteo) {
    const v = parseInt(d.texto || '0', 10);
    return `<div class="hoja modo-${S.modo}"><div class="contenido">${barraHoja(esc(p ? p.nombre : d.codigo), 'Cuántas lleva')}<div class="desliza"><div class="cifra"><div class="valor num">${d.texto ? esc(d.texto) : '<small>0</small>'}</div></div>${tecladoDe(['1', '2', '3', '4', '5', '6', '7', '8', '9', '', '0', '⌫'])}</div>
      <div class="pie"><button class="btn lleno ancho" data-a="cifraLista" ${v > 0 ? '' : 'disabled'}>Dejar ${v || ''}</button></div></div></div>`;
  }
  /* Contar: una casilla por presentación, de la más grande a la suelta, en dos columnas; el total al momento */
  const t = conteoActivo(), dia = t && t.tipo === 'dia', a = S.conteo.actual;
  const pres = presentaciones(p), fila = pres.find(x => x.k === d.fila) || pres[pres.length - 1];
  const conPunto = p.unidad === 'm' && fila.k === 'suelta';
  const num = v => parseFloat(v || '0') || 0;
  const aqui = redondo(pres.reduce((s, x) => s + num(d.valores[x.k]) * x.piezas, 0));
  const otros = dia ? otrosLugaresDia(d.codigo) : [], deOtros = redondo(otros.reduce((s, [, v]) => s + v, 0));
  const tecleado = pres.some(x => (d.valores[x.k] || '') !== '');
  const nada = !tecleado && aqui === 0 && !deOtros;
  const casillas = pres.map(x => `<button class="caja${fila.k === x.k ? ' on' : ''}" data-a="filaCifra" data-k="${x.k}" aria-pressed="${fila.k === x.k}"><strong>${x.nombre}</strong><span class="valor num">${esc(d.valores[x.k] || '0')}</span></button>`).join('');
  const pie = dia
    ? `<div class="fila-botones"><button class="btn borde crece" data-a="otroLugar" ${aqui > 0 || tecleado ? '' : 'disabled'}>Otro lugar</button><button class="btn lleno crece" data-a="cifraLista" ${nada ? 'disabled' : ''}>${ic('check')}${nada ? 'Teclea cuántos hay' : `Es todo · ${redondo(aqui + deOtros)}`}</button></div>`
    : `<button class="btn lleno ancho" data-a="cifraLista" ${nada ? 'disabled' : ''}>${ic('check')}${nada ? 'Teclea cuántos hay' : aqui === 0 ? 'Guardar 0 · no hay' : `Guardar ${aqui}`}</button>`;
  const lugar = (a && a.lugar) || S.conteo.lugar || 'este lugar';
  return `<div class="hoja modo-conteo teclado-conteo"><div class="contenido"><button class="jalar" data-a="cerrarHoja" aria-label="Cerrar: se tira lo tecleado"></button>${barraHoja(esc(p.nombre), `Lo de ${esc(lugar)}${otros.length ? ` · ${textoLugares(otros)}` : ''}`)}<div class="desliza">
    <div class="cajas dos">${casillas}</div><div class="fila-total"><span>${dia && otros.length ? `${aqui} aquí + ${textoLugares(otros)}` : 'Aquí'}</span><b class="num">${unidad(p, redondo(aqui + deOtros))}</b></div>${tecladoDe(['1', '2', '3', '4', '5', '6', '7', '8', '9', conPunto ? '.' : '', '0', '⌫'], ' chico')}</div>
    <div class="pie">${pie}</div></div></div>`;
}
function hojaAbrirDepto() {
  const abiertos = CONTEOS.filter(t => t.tipo === 'completo').map(t => t.depto);
  const lista = Object.entries(DEPTOS).filter(([k]) => !abiertos.includes(k));
  return `<div class="hoja modo-conteo"><div class="contenido">${barraHoja('Abrir un departamento', 'Para el conteo completo')}<div class="desliza"><div class="tareas compactas">
    ${lista.length ? lista.map(([k, n]) => `<button class="tarea" data-a="abrirDeptoElegido" data-id="${k}"><span class="ic">${ic('conteo')}</span><span><strong>${n}</strong><small>${CATALOGO.filter(p => p.depto === k && !p.base).length * 14} productos${CERRADOS[k] ? ` · se contó el ${CERRADOS[k]}` : ''}</small></span>${ic('adelante', 'i ch')}</button>`).join('') : '<div class="vacio">Todos los departamentos están abiertos.</div>'}
    </div><p class="nota" style="margin-top:10px">Cuentan todos los que estén en el wifi de la tienda, con la app o con la página /conteo; las capturas se suman. Revisar las diferencias y cerrarlo es en la caja (F4).</p></div></div></div>`;
}
/* «¿Qué vas a contar?»: una hoja, porque ahí no se escanea; caben los departamentos del arranque */
const ahoraDe = x => { const l = x.ahora ? x.ahora.split(', ') : []; const yo = PERSONAS[S.persona] && PERSONAS[S.persona].nombre; if (S.conteo.activo === x.id && yo && !l.includes(yo)) l.push(yo); return l.join(', '); };
function hojaElegirConteo() {
  const c = S.conteo, per = PERSONAS[S.persona], res = S.hojaDatos && S.hojaDatos.resumen;

    } else {

    }
  }
  if (per.completo) h += `<button class="tarea" data-a="abrirDepto"><span class="ic">${ic('mas')}</span><span><strong>Abrir otro departamento</strong><small>Lo que nadie cuente queda en 0 al cerrarlo</small></span>${ic('adelante', 'i ch')}</button>`;
  h += `</div><p class="nota" style="margin:8px 2px 0">${per.completo ? '' : `${esc(per.nombre)} cuenta en lo que ya está abierto; abrir un departamento pide «Conteo completo». `}Revisar y cerrar: en la caja (F4).</p>`;

  return h + `</div></div></div>`;

/* El lugar: una vez por vuelta, con el orden que hace cuadrar el cierre */
function hojaLugar() {
  const c = S.conteo, t = conteoActivo(), d = S.hojaDatos || {};
  const titulo = d.seguir ? '¿En qué lugar sigues?' : d.cambiar ? '¿Dónde estás?' : `${t && t.tipo === 'completo' ? esc(t.titulo) : 'Del día'}: ¿dónde empiezas?`;
