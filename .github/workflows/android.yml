# Corre las pruebas de la JVM y compila el módulo del escáner en cada PR y en main. La app y su APK se agregan cuando
# llega su módulo.
name: Android

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  compilar:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4

      - name: Pruebas de la JVM
        run: ./gradlew --no-daemon test

      - name: Módulo del escáner
        run: ./gradlew --no-daemon :escaner:assembleDebug :escaner:assembleDebugAndroidTest

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: resultados-pruebas
          path: '**/build/reports/tests/'
          retention-days: 14
